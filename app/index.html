<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sanel Prototip Takip</title>
</head>
<body>
<style>
/* Tek (açık) tema bilinçli seçim. Düzen: koyu logo şeridi → filtre çubuğu → özet satırı → Excel benzeri gruplu tablo / grafikler / ürünler. */
:root{
  color-scheme:light;
  --strip:#1F2A36; --strip-2:#3B4857; --strip-ink:#FFFFFF; --strip-mute:#AEB8C4;
  --bg:#FFFFFF; --head:#F5F6F7; --group:#EDEFF2; --line:#E6E8EB; --line-2:#CFD4DA;
  --ink:#1B2128; --ink-2:#4B535C; --muted:#6E7680;
  --s-row:#FFF7CF; --s-bar:#E1B400; --s-chip:#FFE78A; --s-ink:#5A4700;
  --f-row:#FFEBDD; --f-bar:#E8772E; --f-chip:#FFD2B3; --f-ink:#7A3410;
  --k-row:#E6EEF9; --k-bar:#4C82C3; --k-chip:#CFDDF2; --k-ink:#1C4A7E;
  --b-bar:#D33F49; --b-chip:#F9D0D3; --b-ink:#8A1822;
  --d-row:#E3F4E7; --d-bar:#2E9E55; --d-chip:#C9EBD1; --d-ink:#1C5E33;
  --late:#C62828; --soon:#B25A10; --order:#4C82C3; --prod:#7B5CC4; --cancel:#B8BEC5;
  --f-body:"IBM Plex Sans","Segoe UI",Tahoma,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow","Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font:13.5px/1.4 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--strip);outline-offset:1px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* Şerit */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--strip);color:var(--strip-ink)}
.strip-in{display:flex;align-items:center;gap:22px;height:52px;padding-inline:max(16px,2.2vw)}
.strip img{height:22px;width:auto;display:block}
.strip .sep{width:1px;height:22px;background:var(--strip-2)}
.nav{display:flex;height:52px;align-items:stretch}
.nav button{border:0;background:none;color:var(--strip-mute);padding:0 14px;font-size:14px;font-weight:500;cursor:pointer}
.nav button[aria-selected="true"]{color:var(--strip-ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--strip-ink)}
.nav button:hover{color:var(--strip-ink)}
.grow{flex:1}
.sync{font-size:12px;color:var(--strip-mute);white-space:nowrap}
.sync.err{color:#FFB4AE}
.btn-new{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;background:#FFFFFF;color:var(--strip);border:0;border-radius:4px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-new:hover{background:#E9EDF1}
.who{border:1px solid var(--strip-2);background:none;color:var(--strip-mute);height:30px;padding:0 10px;border-radius:4px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.who:hover{color:#FFFFFF;border-color:var(--strip-mute)}
.who.need{color:#FFD9A8;border-color:#FFD9A8}
.who-in{height:30px;border:0;border-radius:4px;padding:0 8px;font-size:13px;width:150px}

/* Filtre */
.wrap{padding-inline:max(16px,2.2vw)}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;min-width:0}
.in{height:32px;border:1px solid var(--line-2);border-radius:3px;padding:0 8px;background:#FFFFFF;font-size:13px;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0;min-width:0}
select.in{padding-right:6px}
.seg{display:flex;height:32px;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line-2);background:#FFFFFF;padding:0 12px;font-size:13px;cursor:pointer;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--strip);color:#FFFFFF;font-weight:600}
.btn{height:32px;padding:0 12px;border:1px solid var(--line-2);background:#FFFFFF;border-radius:3px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--strip)}
.btn.dark{background:var(--strip);border-color:var(--strip);color:#FFFFFF;font-weight:600}
.btn.danger{color:var(--late);border-color:#E5A3A3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--strip);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.link:hover{color:#000}

/* Özet */
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px;font-size:13px}
.sum b{font-family:var(--f-mono);font-weight:600}
.sum button{border:0;background:none;padding:2px 4px;margin:-2px -4px;border-radius:3px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.sum button:hover{background:var(--head)}
.sum button[aria-pressed="true"]{background:var(--group);box-shadow:inset 0 0 0 1px var(--line-2)}
.sq{width:9px;height:9px;border-radius:2px;flex-shrink:0;display:inline-block}
.pbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#EEF0F2;width:min(360px,100%)}
.pbar span{display:block;height:100%}

/* Tablo */
.tbl{border:1px solid var(--line);border-radius:4px;overflow-x:auto;margin-bottom:28px}
.grid{min-width:1180px}
.row{display:grid;grid-template-columns:34px minmax(150px,1.3fr) 96px minmax(120px,1fr) minmax(140px,1.2fr) 76px 64px 110px 176px minmax(160px,1.6fr) 30px;align-items:center;min-height:34px;border-bottom:1px solid var(--line);position:relative}
.row>div{padding:0 6px;min-width:0}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.row.h{min-height:32px;background:var(--head);font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;position:sticky;top:0;z-index:2}
.t-Sanel{background:var(--s-row)}.t-Sanel::before{background:var(--s-bar)}
.t-Alt{background:var(--f-row)}.t-Alt::before{background:var(--f-bar)}
.t-Stok{background:var(--k-row)}.t-Stok::before{background:var(--k-bar)}
.t-Belirsiz::before{background:var(--b-bar)}
.row.done{background:var(--d-row)}.row.done::before{background:var(--d-bar)}
.row.cancel{background:#FFFFFF;color:var(--cancel)}.row.cancel::before{background:var(--cancel)}
.row.cancel .c-part{text-decoration:line-through}
.row.sel{box-shadow:inset 0 0 0 2px var(--strip)}
.gh{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;min-height:40px;padding:6px 12px 6px 10px;background:var(--group);border-bottom:1px solid #DDE1E5;cursor:pointer}
.gh h3{margin:0;font:700 15px/1.2 var(--f-cond)}
.gh .meta{font-size:12.5px;color:var(--ink-2)}
.gh .acts{display:flex;gap:14px;align-items:center;margin-left:auto}
.caret{width:14px;color:var(--muted);transition:transform .12s}
.g.closed .caret{transform:rotate(-90deg)}
.g.closed .gb{display:none}
.days{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap}
.days.late{background:var(--late);color:#FFFFFF}.days.soon{color:var(--soon);box-shadow:inset 0 0 0 1px var(--soon)}.days.ok{color:var(--ink-2);background:#FFFFFF}
.gnote{padding:7px 12px 7px 44px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cell{width:100%;height:28px;border:1px solid transparent;background:transparent;border-radius:3px;padding:0 6px;font-size:13px;min-width:0;text-overflow:ellipsis}
.cell:hover:not(:disabled){border-color:var(--line-2);background:#FFFFFF}
.cell:focus{border-color:var(--strip);background:#FFFFFF;outline:none}
.cell:disabled{color:inherit;cursor:default}
.cell.n{text-align:right;font-family:var(--f-mono)}
.cell.b{font-weight:600}
select.cell{appearance:none;-webkit-appearance:none;cursor:pointer}
select.tp{width:auto;height:22px;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:3px;border:0}
select.tp:hover:not(:disabled){box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tp-Sanel{background:var(--s-chip);color:var(--s-ink)}.tp-Alt{background:var(--f-chip);color:var(--f-ink)}.tp-Stok{background:var(--k-chip);color:var(--k-ink)}.tp-Belirsiz{background:var(--b-chip);color:var(--b-ink)}
.st{display:flex;align-items:center;gap:7px;width:100%;height:26px;border:1px solid var(--line-2);background:#FFFFFF;border-radius:3px;padding:0 8px;font-size:12.5px;font-weight:500;cursor:pointer;text-align:left}
.st:hover:not(:disabled){border-color:var(--strip)}
.st:disabled{cursor:default}
.st span.l{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq-open{background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #8A939D}.sq-wait{background:var(--f-bar)}.sq-order{background:var(--order)}.sq-prod{background:var(--prod)}.sq-done{background:var(--d-bar)}.sq-cancel{background:var(--cancel)}
.rm{border:0;background:none;color:transparent;cursor:pointer;width:24px;height:24px;border-radius:3px;font-size:13px}
.row:hover .rm{color:var(--muted)}
.rm:hover,.rm:focus{color:var(--late)!important;background:#FFFFFF}
.rm.arm{color:#FFFFFF!important;background:var(--late);width:auto;padding:0 6px;font-size:11.5px;font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:600;color:var(--late);margin-right:6px;white-space:nowrap}

/* Menü */
.menu{position:fixed;z-index:60;width:216px;background:#FFFFFF;border:1px solid var(--line-2);border-radius:4px;box-shadow:0 8px 24px rgba(20,30,40,.16);padding:4px 0}
.menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 12px;font-size:13px;cursor:pointer;text-align:left}
.menu button:hover,.menu button:focus{background:var(--head);outline:none}
.menu button[aria-checked="true"]{font-weight:600}

/* Toplu */
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--strip);color:#FFFFFF;border-radius:6px;padding:8px 10px 8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);font-size:13px}
.bulk select,.bulk input{height:30px;border:0;border-radius:3px;padding:0 6px;background:#FFFFFF;color:var(--ink);font-size:13px}
.bulk .btn{height:30px;border:0}
.bulk .ghost{background:none;color:var(--strip-mute);border:0;cursor:pointer}

/* Panel */
.panel{border:1px solid var(--line);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px}
.ph h2{margin:0;font:700 17px var(--f-cond)}
.ph .sub{font-size:12.5px;color:var(--muted)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}

/* Grafik */
.charts{display:flex;flex-direction:column;gap:20px;padding-block:18px 32px}
.panel{border:1px solid var(--line);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px}
.ph h2{margin:0;font:700 17px var(--f-cond)}
.ph .sub{font-size:12.5px;color:var(--muted)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.c3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:1100px){.c3{grid-template-columns:1fr}}
.gantt{overflow-x:auto}
.gantt-in{min-width:760px;display:grid;grid-template-columns:160px minmax(0,1fr)}
.gl{height:32px;display:flex;align-items:center;font-size:13px;font-weight:600;border-bottom:1px solid #F0F1F3;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gl small{font-weight:400;color:var(--muted);margin-left:6px;font-size:11.5px}
.gt{position:relative;height:32px;border-bottom:1px solid #F0F1F3}
.gline{position:absolute;top:50%;height:2px;margin-top:-1px;background:#D5D9DE}
.ms{position:absolute;top:50%;width:13px;height:13px;margin:-6px 0 0 -6px;transform:rotate(45deg);border:2px solid #FFFFFF;cursor:pointer;padding:0}
.ms-done{background:var(--d-bar)}.ms-late{background:var(--late)}.ms-soon{background:var(--f-bar)}.ms-next{background:#FFFFFF;border-color:#6B7580}
.ml{position:absolute;top:0;transform:translateX(-50%);font:600 10px var(--f-mono);color:var(--ink-2);white-space:nowrap;pointer-events:none}
.axis{position:relative;height:22px;border-bottom:1px solid #D5D9DE}
.axis span{position:absolute;bottom:3px;font:11px var(--f-mono);color:var(--muted);padding-left:4px;border-left:1px solid #D5D9DE;height:16px}
.gtoday{position:absolute;top:0;bottom:0;border-left:2px dashed var(--strip);pointer-events:none}
.gtoday b{position:absolute;top:-22px;left:0;transform:translateX(-50%);font:600 10.5px var(--f-mono);background:var(--strip);color:#FFFFFF;padding:2px 6px;border-radius:2px;white-space:nowrap}
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 78px;align-items:center;gap:10px;height:26px;font-size:13px;border:0;background:none;width:100%;padding:0;text-align:left;cursor:pointer;border-radius:3px}
.hb:hover{background:var(--head)}
.hb .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{display:flex;height:14px;background:#F2F3F5}
.hb .v{font:12px var(--f-mono);text-align:right;color:var(--ink-2)}

/* Ürünler */
.prod{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;padding-block:18px 32px}
@media (max-width:760px){.prod{grid-template-columns:1fr}}
.plist{border:1px solid var(--line);border-radius:4px;padding:6px;align-self:start}
.plist h4{margin:10px 8px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.plist button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;text-align:left;padding:7px 9px;border-radius:3px;cursor:pointer;font-size:13.5px}
.plist button:hover{background:var(--head)}
.plist button[aria-current="true"]{background:var(--strip);color:#FFFFFF;font-weight:600}
.plist button small{font:11.5px var(--f-mono);opacity:.7}
.form{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.bomrow{display:grid;grid-template-columns:minmax(170px,1.3fr) 140px 80px 110px minmax(110px,1fr) minmax(120px,1fr) 84px 120px 34px;align-items:center;min-height:34px;border-bottom:1px solid var(--line);position:relative;min-width:1000px}
.bomrow>div{padding:0 6px}
.bomrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.hint{font-size:12.5px;color:var(--muted);max-width:75ch;margin:0 0 12px}
.dirty{font-size:12.5px;color:var(--soon);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:2px;background:var(--head);border:1px solid var(--line);border-radius:3px;padding:3px 3px 3px 9px;font-size:13px}
.tag button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 5px;font-size:15px;line-height:1}
.tag button:hover{color:var(--late)}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* Panel (çekmece) */
.scrim{position:fixed;inset:0;background:rgba(20,28,36,.42);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:#FFFFFF;width:min(820px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(10,16,22,.18)}
.dh{display:flex;align-items:center;gap:12px;padding:0 24px;min-height:62px;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.dh h2{margin:0;font:700 20px var(--f-cond)}
.dh .x{margin-left:auto;width:36px;height:36px;border:0;background:none;cursor:pointer;color:var(--ink-2);border-radius:3px}
.dh .x:hover{background:var(--head)}
.db{flex:1;overflow:auto;padding:18px 24px;display:flex;flex-direction:column;gap:18px}
.db>*{flex-shrink:0}
.df{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--line);flex-wrap:wrap;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cg{width:100%;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:4px;display:flex;gap:10px;align-items:center}
.chip{height:32px;padding:0 12px;border:1px solid var(--line-2);background:#FFFFFF;border-radius:3px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--strip);border-color:var(--strip);color:#FFFFFF;font-weight:600}
.pv{border:1px solid var(--line);border-radius:4px;overflow-x:auto}
.pvh{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 12px;background:var(--group);border-bottom:1px solid #DDE1E5;flex-wrap:wrap}
.pvh b{font:700 14.5px var(--f-cond)}
.prow{display:grid;grid-template-columns:32px minmax(130px,1.2fr) 52px 76px 104px minmax(110px,1fr) minmax(120px,1fr) 104px;align-items:center;min-height:34px;border-bottom:1px solid var(--line);position:relative;min-width:720px}
.prow>div{padding:0 5px}
.prow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.prow.off{opacity:.45}
/* giriş ve yetki paneli */
.login{max-width:380px;margin:56px auto;border:1px solid var(--line);border-radius:6px;padding:28px 28px 24px;background:#FFFFFF;display:flex;flex-direction:column;gap:14px}
.login h2{margin:0;font:700 20px var(--f-cond)}
.login .in{height:38px;font-size:14px}
.login .btn{height:38px;justify-content:center;font-size:14px}
.login .err{color:#8A1822;background:#FDECEC;border-radius:3px;padding:8px 10px;font-size:13px}
.utbl{width:100%;border-collapse:collapse;font-size:13px}
.utbl th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.utbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.utbl td.m{color:var(--muted);font-size:12px;white-space:nowrap}
.utbl select{height:30px}
.rtag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:12px;font-weight:600;background:#EEF1F4}
.c-part .sk{display:block;font:11px/1.2 var(--f-mono,ui-monospace,monospace);color:var(--muted);padding:0 6px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.codes{font:11.5px var(--f-mono,ui-monospace,monospace);color:var(--muted);white-space:nowrap}
.plan{width:100%;border-collapse:collapse;font-size:13px}.plan th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line-2)}.plan td{padding:5px 8px;border-bottom:1px solid var(--line)}.plan .in{height:30px}
.appr{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:3px;white-space:nowrap}
.appr.pend{background:#FFF3D6;color:#7A4B00}.appr.rej{background:#FDECEC;color:#8A1822}
.g.pend .gh{background:#FFFBEF}.g.rej .gh{background:#FFF6F6}
.btn.ok{background:#1F7A3D;border-color:#1F7A3D;color:#FFFFFF;font-weight:600;height:28px}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.pendbtn{border:0;background:#F5B841;color:#2B1C00;height:30px;padding:0 10px;border-radius:4px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.warn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FDECEC;color:#8A1822;border-radius:3px;padding:8px 10px;font-size:13px}

.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:4px;margin-block:10px 28px}
.empty h3{margin:0 0 6px;font:700 17px var(--f-cond);color:var(--ink)}

/* ---------- Veri türetme ---------- */
/* Mühendisin önerdiği yeni ürün, onaylanana kadar talebin içinde (proposedProduct) durur */
const prodOf=r=>S.products[r.product]||(r.proposedProduct?Object.assign({program:"",customer:"",ord:99,parts:[]},r.proposedProduct):{name:r.product||"?",program:"",customer:"",ord:99,parts:[]});
/* Talebin müşterisi talepte tutulur (aynı ürün Ford'a da Iveco'ya da gidebilir); eski kayıtlarda ürününkine düşer */
const custOf=r=>r.customer||prodOf(r).customer||"—";
/* Onay akışı: approval alanı olmayan talepler onaylıdır */
const apprOf=r=>(r&&r.approval&&r.approval.state)||"approved";
const isMine=r=>!!(r&&r.approval&&S.me&&r.approval.requestedBy===S.me);
const canEditReq=r=>S.canApprove||(apprOf(r)==="approved"?canEdit():(isMine(r)&&!!S.canRequest));
const canRequest=()=>!!S.db&&(S.canRequest!==undefined?S.canRequest:canEdit());
const planLabel=x=>[x.customer,x.phase,x.platform&&x.platform!==x.customer?x.platform:""].filter(Boolean).join(" · ")+(x.due?" · "+fmtD(x.due):"");
function allItems(withPending){
  const out=[];
  for(const [rid,r] of Object.entries(S.requests)){
    if(r.deleted)continue;const ap=apprOf(r);if(ap!=="approved"&&!withPending)continue;const p=prodOf(r);
    for(const [iid,it] of Object.entries(r.items||{})){
      if(!it||it.deleted)continue;
      const due=it.due||r.due||null;
      out.push({rid,iid,r,it,p,due,days:dayDiff(due),done:DONE.includes(it.status),cancel:it.status==="İptal",type:normT(it.type),appr:ap});
    }
  }
  return out;
}
const isOpen=x=>!x.done&&!x.cancel;
const isLate=x=>isOpen(x)&&x.days!=null&&x.days<0;
const isSoon=x=>isOpen(x)&&x.days!=null&&x.days>=0&&x.days<=7;
function reqPass(r,f,skip){
  skip=skip||{};const p=prodOf(r);
  if(f.customer&&custOf(r)!==f.customer)return false;
  if(!skip.phase&&f.phase){if(f.phase==="__adhoc"){if(!r.adhoc)return false}else if(r.adhoc||r.phase!==f.phase)return false}
  if(!skip.dk&&f.dk&&dkey(r)!==f.dk)return false;
  if(!skip.product&&f.product&&r.product!==f.product)return false;
  return true;
}
function passes(x,f,skip){
  skip=skip||{};
  if(!reqPass(x.r,f,skip))return false;
  if(!skip.type&&f.type&&x.type!==f.type)return false;
  if(!skip.owner&&f.owner&&(x.it.owner||"(atanmamış)")!==f.owner)return false;
  if(!skip.status){
    if(f.status==="open"&&!isOpen(x))return false;
    if(f.status==="late"&&!isLate(x))return false;
    if(f.status==="done"&&!x.done)return false;
  }
  if(f.q){const h=trLower([x.it.part,x.p.name,x.it.maker,x.it.material,x.it.stock,x.it.note,x.r.phase,x.r.label,x.it.owner].join(" "));if(!h.includes(trLower(f.q)))return false}
  return true;
}

const queues={};let pending=0;
function enqueue(path,fn){const p=(queues[path]||Promise.resolve()).then(fn,fn);queues[path]=p.catch(()=>{});return p}
function setSync(t,err){const el=$("#sync");el.textContent=t;el.classList.toggle("err",!!err)}
async function write(path,fn,okMsg){
  if(!S.db){toast("Veritabanına bağlı değil; değişiklik kaydedilmedi.",true);return false}
  if(S.standalone&&!S.me&&!S.askedName){S.askedName=true;toast("Değişikliklerin kimden geldiği görünsün diye sağ üstten adınızı girin.")}
  pending++;setSync("Kaydediliyor…");
  try{await enqueue(path,fn);if(okMsg)toast(okMsg);return true}
  catch(e){if(e&&e.code==="invalid_argument"&&!S.canWriteKnown){S.canWrite=false;$("#ro").hidden=false;render()}toast(errText(e),true);return false}
  finally{pending--;if(!pending)setSync("Kaydedildi · canlı")}
}
function errText(e){const c=e&&e.code;return c==="quota_exceeded"?"Veritabanı dolu; eski talepleri silin.":c==="resource_exhausted"?"Çok hızlı işlem yapıldı, birkaç saniye sonra tekrar deneyin.":c==="invalid_argument"?"Kaydedilemedi: düzenleme yetkiniz yok.":"Kaydedilemedi; bağlantıyı kontrol edip tekrar deneyin."}
function stamp(o){o.updatedAt=nowISO();if(S.me)o.by=S.me;return o}
const reqRef=rid=>S.db.collection("requests").doc(rid);
function updItem(rid,iid,patch){return write("requests/"+rid,()=>reqRef(rid).update({items:{[iid]:stamp(Object.assign({},patch))},updatedAt:nowISO()}))}
function updItemsBulk(targets,patch){
  const by={};for(const t of targets)(by[t.rid]=by[t.rid]||[]).push(t.iid);
  return Promise.all(Object.entries(by).map(([rid,iids])=>{const items={};for(const i of iids)items[i]=stamp(Object.assign({},patch));return write("requests/"+rid,()=>reqRef(rid).update({items,updatedAt:nowISO()}))}));
}
const saveCfg=patch=>{const body=Object.assign({},S.cfg,patch);return write("config/lists",()=>S.db.collection("config").doc("lists").set(body))};
let tt;function toast(m,err){$("#toast").innerHTML='<div class="toast'+(err?" err":"")+'" role="status">'+esc(m)+'</div>';clearTimeout(tt);tt=setTimeout(()=>$("#toast").innerHTML="",err?5000:2200)}
const canEdit=()=>S.canWrite&&!!S.db;
const D=()=>canEdit()?"":" disabled";
function opts(list,val,blank){const l=[...list];if(val&&!l.includes(val))l.push(val);return (blank!=null?'<option value="">'+esc(blank)+'</option>':"")+l.map(v=>'<option'+(v===val?" selected":"")+'>'+esc(v)+'</option>').join("")}

function summary(list){
  const tot=list.length,done=list.filter(x=>x.done).length,cancel=list.filter(x=>x.cancel).length,open=list.filter(isOpen);
  const by=t=>open.filter(x=>x.type===t).length;const late=open.filter(isLate).length,soon=open.filter(isSoon).length;
  const base=Math.max(1,tot-cancel),pct=Math.round(done/base*100);const seg=(n,c)=>n?'<span style="width:'+(n/base*100)+'%;background:'+c+'"></span>':"";
  const tb=t=>by(t)||S.f.type===t?'<button type="button" data-type="'+t+'" aria-pressed="'+(S.f.type===t)+'" title="Yalnızca bunları göster"><span class="sq" style="background:'+TYPE_BAR[t]+'"></span>'+TYPE_LBL[t]+' <b>'+by(t)+'</b></button>':"";
  return '<div class="sum" id="sum"><span><b style="font-size:15px">'+tot+'</b> kalem</span><span style="display:flex;align-items:center;gap:6px"><span class="sq sq-done"></span><b>'+done+'</b> bitti</span>'+
    tb("Sanel")+tb("Alt Tedarikçi")+tb("Stok")+tb("Belirsiz")+
    (late?'<span style="color:var(--late);font-weight:600">Termini geçen <b>'+late+'</b></span>':'<span class="muted">Termini geçen yok</span>')+
    (soon?'<span style="color:var(--soon);font-weight:600">7 gün içinde <b>'+soon+'</b></span>':"")+

}

const CUST_COLOR={Ford:"#1F5FAD",Iveco:"#0F7B6C",Sanel:"#6E7680"};
const cColor=c=>CUST_COLOR[c]||"#5B6470";
const MON=["OCA","ŞUB","MAR","NİS","MAY","HAZ","TEM","AĞU","EYL","EKİ","KAS","ARA"];
const MONL=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const DOWL=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const CUST_ORDER=["Ford","Iveco","Sanel"];
const custSort=(a,b)=>(CUST_ORDER.indexOf(a)+1||9)-(CUST_ORDER.indexOf(b)+1||9)||String(a).localeCompare(String(b),"tr");
const phaseOrd=p=>{const i=S.cfg.phases.indexOf(p);return i<0?999:i};
const longD=iso=>{if(!iso)return "Termin belirsiz";const d=new Date(iso+"T00:00:00");return DOWL[d.getDay()]+", "+d.getDate()+" "+MONL[d.getMonth()]+" "+d.getFullYear()};
const shortD=iso=>iso?(+iso.slice(8,10))+" "+MON[+iso.slice(5,7)-1]:"—";
/* Fazsız teslimat: faza bağlı olmayan, yalnızca tarihi olan talep (adhoc) */
const phaseName=r=>r.adhoc?(r.label||"Fazsız teslimat"):(r.phase||"—");
/* Teslimat anahtarı: aynı müşteri · faz · teslim yeri · termin = tek teslimat */
const dkey=r=>[custOf(r),r.adhoc?"__adhoc":r.phase||"",r.platform||"",r.due||"",r.adhoc?r.label||"":""].join("|");
function tone(due,allDone){if(allDone)return "done";if(!due)return "none";const d=dayDiff(due);return d<0?"late":d<=7?"soon":"ok"}
function leftTxt(due,allDone){if(allDone)return "Hazır";if(!due)return "Termin yok";const d=dayDiff(due);return d<0?(-d)+" gün geçti":d===0?"Bugün":d===1?"Yarın":d+" gün kaldı"}
const ctag=c=>'<span class="ctag" style="background:'+cColor(c)+'">'+esc(c)+'</span>';
const lpill=(due,done)=>'<span class="lp '+tone(due,done)+'">'+esc(leftTxt(due,done))+'</span>';
const dblk=(due,done)=>'<span class="dblk '+tone(due,done)+'" aria-hidden="true">'+(due?'<b>'+(+due.slice(8,10))+'</b><span>'+MON[+due.slice(5,7)-1]+'</span>':'<b>?</b><span>TARİH</span>')+'</span>';
const mbar=p=>'<span class="mbar" aria-hidden="true"><i style="width:'+Math.round(p)+'%"></i></span>';
const qtyOf=r=>r.sets?r.sets:r.direct?r.direct:0;
const codeFor=(p,c)=>{const pc=p.codes||{};return c==="Iveco"?pc.iveco:c==="Ford"?pc.ford:pc.sanel};
const slug=s=>trLower(s).replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function planIdFor(x){const pl=S.cfg.plan||[];let id=slug(x.customer+"-"+x.phase+"-"+(x.platform||x.customer));if(pl.some(p=>p.id===id))id+="-"+(x.due||"tarihsiz");const b=id;let k=2;while(pl.some(p=>p.id===id))id=b+"-"+k++;return id}
const planMatch=x=>(S.cfg.plan||[]).find(p=>p.customer===x.customer&&p.phase===x.phase&&(p.platform||p.customer)===(x.platform||x.customer)&&(p.due||null)===(x.due||null));
function slugId(name){let id=slug(name)||uid("p");if(S.products[id])id+="-"+Math.random().toString(36).slice(2,5);return id}
const canYon=()=>canEdit()||!!S.canManage;
function setTab(t){S.tab=t;LS.set("tab",t);S.sel.clear();closeMenu();window.scrollTo(0,0);render()}
function itemsIndex(withPending){const by={};for(const x of allItems(withPending))(by[x.rid]=by[x.rid]||[]).push(x);return by}
function reqStats(xs){xs=xs||[];const base=xs.filter(x=>!x.cancel),done=base.filter(x=>x.done).length,open=base.filter(x=>!x.done);
  return{n:base.length,done,open:open.length,late:open.filter(isLate).length,unk:open.filter(x=>x.type==="Belirsiz").length,pct:base.length?done/base.length*100:0,all:base.length>0&&done===base.length}}
const approvedRids=()=>Object.keys(S.requests).filter(id=>{const r=S.requests[id];return !r.deleted&&apprOf(r)==="approved"});
function deliveriesOf(rids,by){
  const g={};
  for(const rid of rids){const r=S.requests[rid],k=dkey(r);
    const d=g[k]=g[k]||{key:k,customer:custOf(r),phase:r.adhoc?"__adhoc":r.phase,adhoc:!!r.adhoc,name:phaseName(r),platform:r.platform||"",due:r.due||null,rids:[],xs:[]};
    d.rids.push(rid);d.xs.push(...(by[rid]||[]))}
  return Object.values(g).map(d=>Object.assign(d,reqStats(d.xs),{qty:d.rids.reduce((s,id)=>s+qtyOf(S.requests[id]),0)}))
    .sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||custSort(a.customer,b.customer)||phaseOrd(a.phase)-phaseOrd(b.phase)||a.platform.localeCompare(b.platform,"tr"));
}
function goDlv(k){const r=Object.values(S.requests).find(r=>!r.deleted&&dkey(r)===k);if(!r)return;
  Object.assign(S.f,{customer:custOf(r),phase:r.adhoc?"__adhoc":r.phase,dk:k,status:"all",product:"",owner:"",type:"",q:""});saveF();setTab("liste")}
function copyText(t){const ok=()=>toast("Kopyalandı: "+t);
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>fb());else fb();
  function fb(){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){toast("Kopyalanamadı",true)}a.remove()}}

/* ---------- Özet: KPI + aylık takvim + yaklaşan teslimatlar ---------- */
function evHtml(d){const col=cColor(d.customer),p=Math.round(d.pct),late=!d.all&&d.due<todayISO();
  return '<button type="button" class="ev" data-gok="'+esc(d.key)+'" title="'+esc(d.customer+" · "+d.name+(d.platform?" · "+d.platform:"")+" · "+fmtD(d.due)+" · "+d.done+"/"+d.n+" kalem hazır")+'" style="background:linear-gradient(90deg,'+col+' '+p+'%,'+col+'CC '+p+'%)'+(late?";box-shadow:inset 0 0 0 2px #C62828":"")+'"><b>'+esc(d.name)+(d.platform&&d.platform!==d.customer?" · "+esc(d.platform):"")+'</b><span>'+d.rids.length+' ürün · %'+p+'</span></button>'}
function viewOzet(){
  const c=S.oz.cust,t=todayISO(),by=itemsIndex(),allA=approvedRids();
  const custs=[...new Set(allA.map(id=>custOf(S.requests[id])))].sort(custSort);
  const rids=allA.filter(id=>!c||custOf(S.requests[id])===c);
  const dl=deliveriesOf(rids,by);
  const late=dl.filter(d=>!d.all&&d.due&&d.due<=t),lateItems=late.reduce((s,d)=>s+d.open,0);
  const soon=dl.filter(d=>!d.all&&d.due&&d.due>t&&dayDiff(d.due)<=21);
  const xs=rids.flatMap(id=>by[id]||[]),st=reqStats(xs),openXs=xs.filter(isOpen);
  const pend=Object.values(S.requests).filter(r=>!r.deleted&&apprOf(r)==="pending"&&(!c||custOf(r)===c)).length;
  // Termini belirsiz: tarihi olmayan plan satırları + tarihsiz teslimatlar (aynı faz iki kez sayılmaz)
  const und=[];const seen=new Set();
  for(const d of dl)if(!d.due){seen.add(d.customer+"|"+d.phase+"|"+d.platform);und.push({label:d.customer+" · "+d.name+(d.platform&&d.platform!==d.customer?" · "+d.platform:""),key:d.key})}
  for(const x of S.cfg.plan||[])if(!x.due&&(!c||x.customer===c)&&!seen.has(x.customer+"|"+x.phase+"|"+(x.platform||"")))und.push({label:x.customer+" · "+x.phase+(x.platform&&x.platform!==x.customer?" · "+x.platform:""),key:""});
  const kpi=(k,label,v,sub,col,cls)=>'<button type="button" class="kpi'+(cls?" "+cls:"")+'" data-kpi="'+k+'" style="--c:'+col+'"><span class="k">'+label+'</span><span class="v num">'+v+'</span><span class="s">'+sub+'</span></button>';
  const kpis='<div class="kpis">'+
    kpi("late","Geciken / bugün teslim",late.length,late.length?lateItems+" açık kalem":"Geciken teslimat yok",late.length?"#C62828":"#2E9E55")+
    kpi("soon","Önümüzdeki 3 hafta",soon.length,soon.reduce((s,d)=>s+d.rids.length,0)+" ürün · "+soon.reduce((s,d)=>s+d.open,0)+" açık kalem","#B25A10")+
    kpi("prog","Genel ilerleme","%"+Math.round(st.pct),st.done+" / "+st.n+" kalem hazır","#2E9E55")+
    kpi("pend","Onay bekliyor",pend,pend?"Proje mühendislerinden":"Bekleyen talep yok","#F5B841",pend?"warn2":"")+
    kpi("und","Termini belirsiz",und.length,und.length?"faz · tarih girilmeli":"Tüm fazların tarihi var","#8A939D")+'</div>';
  // takvim
  const m=S.calM||t.slice(0,7),[Y,M]=m.split("-").map(Number);
  const off=(new Date(Y,M-1,1).getDay()+6)%7,daysIn=new Date(Y,M,0).getDate(),weeks=Math.ceil((off+daysIn)/7);
  const byDay={};for(const d of dl)if(d.due)(byDay[d.due]=byDay[d.due]||[]).push(d);
  const inMonth=dl.filter(d=>d.due&&d.due.slice(0,7)===m);
  let cal='<div class="cal" role="grid" aria-label="'+MONL[M-1]+' '+Y+' teslimat takvimi">'+["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x=>'<div class="dow">'+x+'</div>').join("");
  for(let i=0;i<weeks*7;i++){const dt=new Date(Y,M-1,1-off+i),iso=dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());
    const evs=byDay[iso]||[],cls=[dt.getMonth()!==M-1?"out":"",i%7>=5?"wk":"",iso===t?"today":""].filter(Boolean).join(" "),open=S.calOpen===iso;
    cal+='<div'+(cls?' class="'+cls+'"':"")+'><div class="n">'+dt.getDate()+(iso===t?'<small>BUGÜN</small>':"")+'</div>'+(open?evs:evs.slice(0,3)).map(evHtml).join("")+
      (evs.length>3?'<button type="button" class="evmore" data-calmore="'+iso+'">'+(open?"daha az":"+"+(evs.length-3)+" daha")+'</button>':"")+'</div>'}
  cal+='</div>';
  const calh='<div class="calh"><h2>'+MONL[M-1]+' '+Y+'</h2><button type="button" class="ib" data-calnav="-1" aria-label="Önceki ay">‹</button><button type="button" class="ib" data-calnav="1" aria-label="Sonraki ay">›</button>'+(m!==t.slice(0,7)?'<button type="button" class="btn sm" data-calnav="0">Bugüne dön</button>':"")+
    '<span class="muted" style="font-size:12.5px">'+inMonth.length+' teslimat · '+inMonth.reduce((s,d)=>s+d.rids.length,0)+' ürün</span><span class="grow"></span><div class="leg">'+custs.filter(x=>!c||x===c).map(x=>'<span><i style="background:'+cColor(x)+'"></i>'+esc(x)+'</span>').join("")+'<span><i style="background:#fff;box-shadow:inset 0 0 0 2px #C62828"></i>Gecikmiş</span><span class="muted">Koyu kısım: hazır olan oran</span></div></div>';
  // yan sütun
  const up=dl.filter(d=>!d.all&&d.due).slice(0,8);
  const upHtml=up.length?up.map(d=>'<button type="button" class="up" data-gok="'+esc(d.key)+'">'+dblk(d.due,d.all)+'<span class="md"><span class="l1"><b>'+esc(d.name)+'</b>'+ctag(d.customer)+lpill(d.due,d.all)+'</span><span class="l2">'+esc([d.platform&&d.platform!==d.customer?d.platform:"",d.rids.map(id=>prodOf(S.requests[id]).name).join(", ")].filter(Boolean).join(" · "))+'</span><span class="l3">'+mbar(d.pct)+d.done+' / '+d.n+' kalem</span></span></button>').join(""):'<p class="muted" style="margin:10px 0 0">Açık teslimat yok.</p>';
  const undHtml=und.length?'<section class="card"><h2>Termini belirsiz</h2><p class="hint" style="margin:4px 0 10px">Tarihi girilmemiş fazlar takvimde görünmez.</p><div class="chips">'+und.map(u=>'<button type="button" class="chipb" '+(canYon()?'data-gplan':'data-gok="'+esc(u.key)+'"')+'>'+esc(u.label)+(canYon()?' — <em>tarih gir</em>':"")+'</button>').join("")+'</div></section>':"";
  const prodIds=new Set(rids.map(id=>S.requests[id].product));
  const noStock=Object.entries(S.products).filter(([id])=>!c||prodIds.has(id)).reduce((s,[,p])=>s+(p.parts||[]).filter(x=>!x.stock).length,0);
  const unk=openXs.filter(x=>x.type==="Belirsiz").length,noOwn=openXs.filter(x=>!x.it.owner).length;
  const miss=(k,l,n)=>'<button type="button" class="miss'+(n?" red":"")+'" data-miss="'+k+'"><span>'+l+'</span><b class="num">'+n+'</b></button>';
  return '<div class="ov"><div class="ovh"><div><div class="dd">'+esc(longD(t))+'</div><h1>Prototip durumu</h1></div><span class="grow"></span><div class="seg2" role="group" aria-label="Müşteri">'+[["","Tümü"]].concat(custs.map(x=>[x,x])).map(([k,l])=>'<button type="button" data-ozc="'+esc(k)+'" aria-pressed="'+(c===k)+'">'+esc(l)+'</button>').join("")+'</div></div>'+
    kpis+'<div class="cols"><section class="cm card" aria-label="Takvim">'+calh+cal+'</section><div class="cs"><section class="card"><h2>Yaklaşan teslimatlar</h2>'+upHtml+'</section>'+undHtml+
    '<section class="card"><h2>Eksik bilgiler</h2><div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">'+miss("type","Üretim tipi belirsiz açık kalem",unk)+miss("owner","Sorumlusu atanmamış açık kalem",noOwn)+miss("stock","Stok kodu girilmemiş parça (ürün ağacı)",noStock)+'</div></section></div></div></div>';
}

/* ---------- Teslimatlar: faz rayı → teslimat kartları → ürün satırları ---------- */
function prqHtml(rid,tot,xs,narrow){
  const r=S.requests[rid],p=prodOf(r),st=reqStats(tot),ce=canEditReq(r),open=narrow||S.open.has(rid);
  const rs=!tot.length?'<span class="rst">Parça yok</span>':st.all?'<span class="rst ok">Hazır</span>':st.unk?'<span class="rst bad" title="'+st.unk+' kalemin üretim tipi belirsiz">Bilgi eksik</span>':st.done?'<span class="rst part">Kısmen hazır</span>':'<span class="rst">Açık</span>';
  const q=r.sets?r.sets:r.direct?r.direct+" ×":"—";
  let h='<div class="prq"><button type="button" class="cx" data-rx="'+esc(rid)+'" aria-expanded="'+open+'" aria-label="'+esc(p.name)+' alt parçaları"><svg class="caret" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="transform:rotate('+(open?0:-90)+'deg)"><path d="M3 5l4 4 4-4"/></svg></button>'+
    '<div><button type="button" class="pn" data-pdet="'+esc(r.product)+'" title="Ürün detayı">'+esc(p.name)+'</button>'+(r.note?'<div class="muted" style="font-size:12px">'+esc(r.note)+'</div>':"")+'</div>'+
    '<div class="codes">'+esc(codeFor(p,custOf(r))||"—")+'</div><div class="num" style="text-align:right">'+q+(r.spare?'<small class="muted"> +'+r.spare+'</small>':"")+'</div>'+
    '<div style="display:flex;align-items:center;gap:8px">'+mbar(st.pct)+'<span class="num" style="font-size:12px;color:var(--ink-2)">'+st.done+'/'+st.n+'</span></div><div>'+rs+'</div>'+
    '<div class="acts2">'+(ce?'<button type="button" class="link" data-add="'+esc(rid)+'">+ Parça</button><button type="button" class="link" data-edit="'+esc(rid)+'">Düzenle</button>':"")+'</div></div>';
  if(open){const ys=xs.slice().sort((a,b)=>(a.it.ord||0)-(b.it.ord||0)),hidden=tot.length-ys.length;
    h+='<div class="pexp"><div class="grid">'+(ys.length?'<div class="row h"><div></div><div>Parça</div><div>Tip</div><div>Üretici</div><div>Ham madde / Rev</div><div style="text-align:right">Adet</div><div style="text-align:right">Teslim</div><div>Sorumlu</div><div>Durum</div><div>Not</div><div></div></div>'+ys.map(rowHtml).join(""):"")+
      (!tot.length?'<div class="gnote">Bu talepte alt parça tanımlı değil.'+(ce?' <button type="button" class="link" data-add="'+esc(rid)+'">Parça ekle</button>':"")+'</div>':hidden>0?'<div class="gnote">'+hidden+' kalem filtre nedeniyle gizli'+(S.f.status==="open"?" (bitenler)":"")+'.</div>':"")+'</div></div>'}
  return h;
}
function viewTeslimat(){
  const f=S.f,by=itemsIndex(),all=approvedRids();
  // ray: müşteri → faz
  const groups={};for(const id of all){const r=S.requests[id],c=custOf(r),ph=r.adhoc?"__adhoc":r.phase;((groups[c]=groups[c]||{})[ph]=groups[c][ph]||[]).push(id)}
  const allDl=deliveriesOf(all,by);
  const railItem=(c,ph,label,ids)=>{const dl=deliveriesOf(ids,by),nx=dl.find(d=>!d.all),cur=f.customer===c&&f.phase===ph;
    return '<button type="button" class="ri" data-rail="1" data-rc="'+esc(c)+'" data-rp="'+esc(ph)+'" aria-current="'+cur+'"><span class="nm"><b>'+esc(label)+'</b><small>'+(dl.length>1?dl.length+" teslimat · ":"")+ids.length+' ürün</small></span>'+
      (nx?'<span class="lp '+tone(nx.due,false)+'">'+(nx.due?shortD(nx.due):"Tarih yok")+'</span>':'<span class="lp done">Hazır</span>')+'</button>'};
  const custs=Object.keys(groups).sort(custSort);
  let rail='<nav class="rail" aria-label="Fazlar"><button type="button" class="ri" data-rail="1" data-rc="" data-rp="" aria-current="'+(!f.customer&&!f.phase)+'"><span class="nm"><b>Tüm teslimatlar</b><small>'+allDl.length+' teslimat · '+all.length+' ürün</small></span></button>';
  for(const c of custs){const phs=Object.keys(groups[c]).filter(p=>p!=="__adhoc").sort((a,b)=>phaseOrd(a)-phaseOrd(b)||a.localeCompare(b,"tr"));if(!phs.length)continue;
    rail+='<h4><span style="color:'+cColor(c)+'">●</span> '+esc(c)+'</h4>'+phs.map(p=>railItem(c,p,p,groups[c][p])).join("")}
  const ad=custs.filter(c=>groups[c].__adhoc);
  if(ad.length)rail+='<h4>Fazsız teslimatlar</h4>'+ad.map(c=>railItem(c,"__adhoc",c,groups[c].__adhoc)).join("");
  if(canRequest())rail+='<div class="rf"><button type="button" class="link" data-newkind="newphase">+ Yeni faz ya da teslim yeri</button><button type="button" class="link" data-newkind="adhoc">+ Fazsız teslimat (sadece tarih)</button></div>';
  rail+='</nav>';
  // seçili kapsam
  const phaseSel=!!f.phase&&f.phase!=="__adhoc";
  const scope=all.filter(id=>reqPass(S.requests[id],f,{dk:1}));
  const scopeDl=deliveriesOf(scope,by),sst=reqStats(scope.flatMap(id=>by[id]||[]));
  const title=f.phase==="__adhoc"?"Fazsız teslimatlar":f.phase||(f.customer?"Tüm teslimatlar":"Tüm teslimatlar");
  const dkPlan=()=>{const r=Object.values(S.requests).find(r=>!r.deleted&&r.planId&&dkey(r)===(f.dk||(scopeDl[0]&&scopeDl[0].key)));return r?r.planId:""};
  let head='<section class="phh"><div class="t"><h1>'+esc(title)+'</h1>'+(f.customer?ctag(f.customer):"")+'<span class="s">'+scopeDl.length+' teslimat · '+scope.length+' ürün · '+sst.n+' kalem</span><span class="grow"></span>'+
    (canRequest()&&phaseSel?'<button type="button" class="btn" data-newkind="plan" data-nfplan="'+esc(dkPlan())+'">+ Bu teslimata ürün ekle</button>':"")+'</div>'+
    '<div style="display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);max-width:520px">'+mbar(sst.pct)+'<span class="num" style="white-space:nowrap">%'+Math.round(sst.pct)+' hazır · '+sst.done+' / '+sst.n+' kalem</span></div>';
  if(phaseSel&&scopeDl.length>1){const TC={late:"#C62828",soon:"#8A3F00",done:"#1C5E33"};
    head+='<div class="dcards" role="group" aria-label="Teslim yerleri">'+scopeDl.map(d=>'<button type="button" class="dcard" data-dk="'+esc(d.key)+'" aria-pressed="'+(f.dk===d.key)+'"><span class="dt" style="color:'+(TC[tone(d.due,d.all)]||"inherit")+'">'+(d.due?'<b>'+(+d.due.slice(8,10))+'</b><span>'+MON[+d.due.slice(5,7)-1]+'</span>':'<b>?</b><span>TARİH YOK</span>')+'</span><span class="sn">'+esc(d.platform||d.customer)+'</span><small>'+d.rids.length+' ürün · '+esc(leftTxt(d.due,d.all))+'</small>'+mbar(d.pct)+'</button>').join("")+'</div>'+
      (f.dk?'<div><button type="button" class="link" data-dk="">Tüm teslim yerlerini göster</button></div>':"")}
  head+='</section>';
  // filtreler
  const reqsSel=all.filter(id=>reqPass(S.requests[id],f)),xsAll=reqsSel.flatMap(id=>by[id]||[]);
  const forSum=xsAll.filter(x=>passes(x,f,{status:1,type:1})),list=xsAll.filter(x=>passes(x,f));
  const vis={};for(const x of list)(vis[x.rid]=vis[x.rid]||[]).push(x);
  const noFilter=!f.type&&!f.owner&&!f.q&&(f.status==="open"||f.status==="all");
  const shown=reqsSel.filter(id=>vis[id]||(noFilter&&!(by[id]||[]).length)),narrow=!!(f.type||f.owner||f.q);
  let body=head+'<div class="card" style="padding:0 16px">'+summary(forSum)+'</div>';
  const dls=deliveriesOf(shown,by);
  if(!dls.length)body+=emptyState();
  for(const d of dls){
    const ttl=phaseSel?esc(d.platform||d.customer):esc(d.name)+(d.platform&&d.platform!==d.customer?" · "+esc(d.platform):"")+ctag(d.customer);
    body+='<section class="dlv" aria-label="'+esc(d.customer+" "+d.name+" "+d.platform)+'"><div class="dlvh">'+dblk(d.due,d.all)+'<div class="tt"><b>'+ttl+'</b><span>'+esc(longD(d.due))+' · '+d.rids.length+' ürün'+(d.qty?' · '+d.qty+' adet':"")+'</span></div>'+lpill(d.due,d.all)+'<span class="grow"></span><span class="num" style="font-size:12.5px;color:var(--ink-2)">'+d.done+' / '+d.n+' kalem hazır</span></div>'+
      '<div class="dlvb"><div class="prq h"><div></div><div>Ürün</div><div>'+esc(d.customer)+' kodu</div><div style="text-align:right">Adet</div><div>İlerleme</div><div>Durum</div><div></div></div>'+
      d.rids.slice().sort((a,b)=>(prodOf(S.requests[a]).ord||0)-(prodOf(S.requests[b]).ord||0)).map(rid=>prqHtml(rid,by[rid]||[],vis[rid]||[],narrow)).join("")+'</div></section>';
  }
  return '<div class="tsl">'+rail+'<div class="tmain">'+body+'</div></div>'+datalists();
}

  dates.sort();let lo=dnum(dates[0])-10,hi=dnum(dates[dates.length-1])+14;if(hi-lo<60)hi=lo+60;
  const X=iso=>((dnum(iso)-lo)/(hi-lo)*100).toFixed(2)+"%";
  const months=[];{const a=new Date(lo*864e5),b=new Date(hi*864e5);let d=new Date(a.getFullYear(),a.getMonth()+1,1);const M=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];while(d<=b){const iso=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-01";months.push('<span style="left:'+X(iso)+'">'+M[d.getMonth()]+(d.getMonth()===0?" "+String(d.getFullYear()).slice(2):"")+'</span>');d=new Date(d.getFullYear(),d.getMonth()+1,1)}}
  const itemsByReq={};for(const x of all)(itemsByReq[x.rid]=itemsByReq[x.rid]||[]).push(x);
  const prodIds=Object.keys(byProd).sort((a,b)=>(prodOf({product:a}).ord||0)-(prodOf({product:b}).ord||0));
  let gRows="";
  for(const pid of prodIds){
    const rs=byProd[pid].sort((a,b)=>a[1].due.localeCompare(b[1].due));const byDate={};
    for(const [rid,r] of rs){(byDate[r.due]=byDate[r.due]||[]).push([rid,r])}
    const ds=Object.keys(byDate).sort();
    let ms="";
    for(const d of ds){

      const lbl=[...new Set(grp.map(([,r])=>r.adhoc?(r.label||"Fazsız").slice(0,6):PHASE_SHORT[r.phase]||r.phase.slice(0,4)))].join("·");
      const tip=grp.map(([,r])=>custOf(r)+" · "+phaseName(r)+(r.platform&&r.platform!==r.phase?" ("+r.platform+")":"")).join(", ")+" · "+fmtD(d)+" · "+(xs.length?(xs.length-open)+"/"+xs.length+" bitti":"alt parça yok");

      ms+='<button type="button" class="ms ms-'+st+'" style="left:'+X(d)+(hl?";box-shadow:0 0 0 3px rgba(31,42,54,.35)":"")+'" data-gp="'+esc(pid)+'" data-gph="'+esc(grp[0][1].adhoc?"__adhoc":grp[0][1].phase)+'" data-gc="'+esc(custOf(grp[0][1]))+'" title="'+esc(tip)+'" aria-label="'+esc(prodOf({product:pid}).name+": "+tip)+'"></button><span class="ml" style="left:'+X(d)+'">'+esc(lbl)+'</span>';
    }

    gRows+='<div class="gl" data-gprod="'+esc(pid)+'" title="'+esc(p.name)+'">'+esc(p.name)+'<small>'+esc(p.customer||"")+'</small></div><div class="gt"><div class="gline" style="left:'+X(ds[0])+';width:calc('+X(ds[ds.length-1])+' - '+X(ds[0])+')"></div>'+ms+'</div>';

/* Ürün ağacında değişen alanları, bu ürünün açık talep kalemlerine uygular.
   Yalnızca kalemde alan boşsa ya da eski ürün ağacı değeriyle aynıysa (elle değiştirilmemişse) yazar. */
async function applyBomToOpen(pid,oldParts,newParts){
  const F=["type","maker","material","stock","owner"];let n=0;
  for(const [rid,r] of Object.entries(S.requests)){
    if(r.deleted||r.product!==pid||!canEditReq(r))continue;const items={};
    for(const [iid,it] of Object.entries(r.items||{})){
      if(!it||it.deleted||DONE.includes(it.status)||it.status==="İptal")continue;
      const np=newParts.find(x=>x.part===it.part);if(!np)continue;const op=oldParts.find(x=>x.part===it.part)||{};
      const patch={};for(const f of F){const cur=f==="type"?normT(it[f]):(it[f]||""),nv=f==="type"?normT(np[f]):(np[f]||""),ov=f==="type"?normT(op[f]):(op[f]||"");
        if(nv!==cur&&(cur===""||cur===ov||(f==="type"&&cur==="Belirsiz")))patch[f]=np[f]||""}
      if(Object.keys(patch).length){items[iid]=stamp(patch);n++}}
    if(Object.keys(items).length)await write("requests/"+rid,()=>reqRef(rid).update({items,updatedAt:nowISO()}));
  }
  if(n)toast(n+" açık kaleme ürün ağacı bilgisi uygulandı");
}
async function saveBom(){
  const d=S.bomDraft;if(!d.name.trim()){toast("Ürün adı gerekli.",true);return}
  const parts=d.parts.filter(p=>p.part&&p.part.trim()).map(p=>({part:p.part.trim(),perSet:Number(p.perSet)||0,type:p.type||"Belirsiz",maker:p.maker||"",material:p.material||"",owner:p.owner||"",stock:p.stock||"",massG:p.massG??null,note:p.note||""}));
  let id=d._id;
  if(id==="__new"){id=trLower(d.name).replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||uid("p");if(S.products[id])id+="-"+Math.random().toString(36).slice(2,5)}
  const ord=S.products[id]?S.products[id].ord:Math.max(0,...Object.values(S.products).map(p=>p.ord||0))+1;
  const ok=await write("products/"+id,()=>S.db.collection("products").doc(id).set(stamp({name:d.name.trim(),program:d.program||"",customer:d.customer||"",codes:d.codes||{},ord,parts})),"Ürün kaydedildi");
  if(ok&&d._id!=="__new"&&S.bomApply!==false)await applyBomToOpen(id,S.bomOrig||[],parts);
  if(ok){S.bomSel=id;S.bomDraft=null;const nc={};if(d.program&&!S.cfg.programs.includes(d.program))nc.programs=[...S.cfg.programs,d.program];if(d.customer&&!S.cfg.customers.includes(d.customer))nc.customers=[...S.cfg.customers,d.customer];if(Object.keys(nc).length)saveCfg(nc);renderBody()}
}

async function resolveNames(){
  if(S.standalone){document.querySelectorAll("[data-by]").forEach(e=>{const n=e.dataset.by;if(n&&n!=="anonim")e.title=(e.value?e.value+"\n":"")+"Son güncelleyen: "+n});return}
  if(!S.user)return;const els=[...document.querySelectorAll("[data-by]")].filter(e=>e.dataset.by);
  const ids=[...new Set(els.map(e=>e.dataset.by))].filter(i=>!(i in S.names));
  if(ids.length){try{const ps=await S.user.profiles(ids.slice(0,64));for(const i of ids)S.names[i]=(ps&&ps[i]&&ps[i].name)||""}catch(e){}}
  els.forEach(e=>{const n=S.names[e.dataset.by];if(n)e.title=(e.value?e.value+"\n":"")+"Son güncelleyen: "+n});
}

async function applyBulk(){

      const f=t.dataset.f;let val=t.value;
      if(f==="qty"||f==="delivered")val=val===""?null:Math.max(0,Number(val));
      if(f==="part"&&!val.trim()){toast("Parça adı boş bırakılamaz.",true);t.value=S.requests[t.dataset.rid].items[t.dataset.iid].part;return}
      updItem(t.dataset.rid,t.dataset.iid,{[f]:val});if(t.tagName==="SELECT")t.blur();return}
    if(t.dataset.bf!==undefined){const i=+t.dataset.bi;let val=t.value;if(t.dataset.bf==="perSet")val=val===""?0:Number(val);if(t.dataset.bf==="massG")val=val===""?null:Number(val);S.bomDraft.parts[i][t.dataset.bf]=val;
      if(t.dataset.bf==="type"){t.className="cell tp tp-"+tcls(val);t.closest(".bomrow").className="bomrow t-"+tcls(val)}markBomDirty();return}
    if(t.id==="bApply"){S.bomApply=t.checked;return}
    if(["bcFord","bcIveco","bcSanel"].includes(t.id)){S.bomDraft.codes[{bcFord:"ford",bcIveco:"iveco",bcSanel:"sanel"}[t.id]]=t.value.trim();markBomDirty();return}
    if(["bName","bProg","bCust"].includes(t.id)){S.bomDraft[{bName:"name",bProg:"program",bCust:"customer"}[t.id]]=t.value.trim();markBomDirty();return}
  });
  v.addEventListener("focusout",()=>setTimeout(()=>{if(deferred&&!focusedInView())renderBody()},0));
  v.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("cell")&&e.target.tagName==="INPUT")e.target.blur()});
  v.addEventListener("click",e=>{
    const b=e.target.closest("button,[data-toggle],[data-gprod]");if(!b)return;const ds=b.dataset;
    if(ds.toggle!==undefined){if(e.target.closest("button,input,select"))return;const id=ds.toggle;S.closed.has(id)?S.closed.delete(id):S.closed.add(id);LS.set("closed",[...S.closed]);b.parentNode.classList.toggle("closed");b.setAttribute("aria-expanded",String(!S.closed.has(id)));return}
    if(ds.stbtn){openMenu(b);return}
    if(ds.type){S.f.type=S.f.type===ds.type?"":ds.type;saveF();render();return}
    if(ds.edit){openEdit(ds.edit);return}
    if(ds.add){openAddPart(ds.add);return}
    if(ds.rm){if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="Sil?";setTimeout(()=>{if(b.isConnected){b.classList.remove("arm");b.textContent="✕"}},3500);return}
      const [rid,iid]=ds.rm.split("/");updItem(rid,iid,{deleted:true}).then(ok=>ok&&toast("Kalem silindi"));return}
    // grafik → liste
    const go=patch=>{Object.assign(S.f,{phase:"",dk:""},patch);S.tab="liste";LS.set("tab",S.tab);saveF();window.scrollTo(0,0);render()};
    if(ds.cprod){go({product:ds.cprod,owner:"",type:"",q:""});return}
    if(ds.cown){go({owner:ds.cown,type:"",q:""});return}
    if(ds.cmk){go({q:ds.cmk==="(belirsiz)"?"":ds.cmk,type:ds.cmk==="(belirsiz)"?"Belirsiz":"",status:"open"});return}
    if(ds.gp){go({customer:ds.gc||"",product:ds.gp,phase:ds.gph,status:"all",owner:"",type:"",q:""});return}
    if(ds.gprod){go({product:ds.gprod,phase:"",owner:"",type:"",q:""});return}
    // ürünler
    if(ds.bom){if(S.bomDraft&&S.bomDraft._dirty&&S.bomSel!==ds.bom){const c=$("#bConfirm");if(c&&!c.dataset.go){c.dataset.go="1";c.innerHTML='<div class="warn" style="margin-top:10px">Kaydedilmemiş değişiklik var. <button type="button" class="btn" data-bomgo="'+esc(ds.bom)+'">Kaydetmeden geç</button></div>';return}}

    if(ds.bomgo){S.bomSel=ds.bomgo;S.bomDraft=null;renderBody();return}
    if(b.id==="bAdd"){S.bomDraft.parts.push({part:"",perSet:1,type:"Sanel",maker:"",material:"",owner:""});S.bomDraft._dirty=true;renderBody();const ins=v.querySelectorAll("[data-bf=part]");ins.length&&ins[ins.length-1].focus();return}

}

function bomRows(pid){

      NR.rows.__np=src.map(x=>Object.assign({on:true,qtyEdited:false,qty:0},x,{type:normT(x.type)}))}

async function createRequests(){
  if(!nrReady()){syncGo();return}
  const go=$("#nrGo");go.disabled=true;go.textContent="Oluşturuluyor…";
  const viaApproval=!canEdit();   // Proje Mühendisi: talep onaya gider; yeni faz ve yeni ürün onayla birlikte eklenir
  const pl=S.cfg.plan||[],cfg={};const fail=()=>{go.disabled=false;go.textContent="Tekrar dene"};
  let customer=NR.customer,phase="",platform="",due=NR.due||null,planId=null,proposedPlan=null,adhoc=false,label="";
  if(NR.kind==="plan"){const x=pl.find(p=>p.id===NR.planId);customer=x.customer;phase=x.phase;platform=x.platform||x.customer;due=x.due||null;planId=x.id}
  else if(NR.kind==="newphase"){phase=NR.newPhase.trim();platform=NR.platform.trim()||customer;
    const ex=planMatch({customer,phase,platform,due});
    if(ex)planId=ex.id;
    else if(viaApproval)proposedPlan={customer,phase,platform,due};
    else{planId=planIdFor({customer,phase,platform,due});cfg.plan=[...pl,{id:planId,customer,phase,platform,due}]}
    if(!viaApproval&&!S.cfg.phases.includes(phase))cfg.phases=[...S.cfg.phases,phase]}
  else{adhoc=true;phase="Fazsız";label=NR.label.trim();platform=NR.platform.trim()||customer}
  if(!viaApproval&&platform&&!S.cfg.platforms.includes(platform))cfg.platforms=[...S.cfg.platforms,platform];
  if(Object.keys(cfg).length&&!await saveCfg(cfg))return fail();
  // yeni ürün: Düzenleme/Yönetici hemen ekler; mühendisin önerisi talebin içinde onayı bekler
  let npId=null,proposedProduct=null;
  if(NR.np&&NR.prods.includes("__np")){
    npId=slugId(NR.np.name);
    const parts=bomRows("__np").map(r=>({part:r.part,perSet:Number(r.perSet)||1,type:r.type||"Belirsiz",maker:r.maker||"",material:r.material||"",owner:r.owner||"",stock:r.stock||"",massG:null,note:""}));
    const doc={name:NR.np.name.trim(),customer,program:S.cfg.programs[0]||"",codes:NR.np.codes,parts};
    if(viaApproval)proposedProduct=doc;
    else{doc.ord=Math.max(0,...Object.values(S.products).map(p=>p.ord||0))+1;if(!await write("products/"+npId,()=>S.db.collection("products").doc(npId).set(stamp(doc))))return fail()}
    NR.rows[npId]=NR.rows.__np;
  }
  let n=0;const created=[];
  for(const pid0 of NR.prods){
    const pid=pid0==="__np"?npId:pid0;
    const rows=(NR.rows[pid]||[]).filter(r=>r.on);const items={};
    rows.forEach((r,i)=>{items["i"+pad(i+1)]=stamp({part:r.part,type:r.type||"Belirsiz",maker:r.maker||"",material:r.material||"",stock:r.stock||"",qty:r.qty,delivered:null,owner:r.owner||"",status:"Açık",note:r.note||"",ord:i+1})});
    const id=uid("r");
    const doc={product:pid,customer,phase,platform,planId,due,proposedPlan,approval:viaApproval?{state:"pending"}:undefined,sets:NR.mode==="sets"?Number(NR.sets)||null:null,direct:NR.mode==="direct"?Number(NR.direct)||null:null,spare:Number(NR.spare)||0,note:"",createdAt:nowISO(),items};
    if(adhoc){doc.adhoc=true;doc.label=label}
    if(pid0==="__np"&&proposedProduct)doc.proposedProduct=proposedProduct;
    if(await write("requests/"+id,()=>reqRef(id).set(stamp(doc)))){n++;created.push(id)}
  }
  closeModal();
  if(!n)return;
  if(viaApproval){toast(n+" talep yönetici onayına gönderildi");S.on.tab="pending";S.on.sel=created[0];setTab("onay");return}
  toast(n+" talep oluşturuldu");
  Object.assign(S.f,{customer,phase:adhoc?"__adhoc":phase,dk:dkey({customer,phase,platform,due,adhoc,label}),status:"all",product:"",type:"",owner:"",q:""});saveF();setTab("liste");
}

    const o=st[s.col]||{};const docs=Object.keys(o).map(id=>({id,exists:true,data:()=>o[id],metadata:{}}));return{docs,size:docs.length,empty:!docs.length,metadata:{}}};
  const emit=col=>{if(!st)return;subs.filter(s=>!col||s.col===col).forEach(s=>{try{s.cb(snapFor(s))}catch(e){console.error(e)}})};
  const apply=ev=>{if(!st||!ev||!ev.col)return;if(ev.col==="config"){if(ev.id==="lists")st.config=ev.doc||{}}else{const o=st[ev.col]=st[ev.col]||{};if(ev.doc)o[ev.id]=ev.doc;else delete o[ev.id]}emit(ev.col)};
  const load=async()=>{const r=await fetch("api/state",{cache:"no-store"});if(r.status===401){showLogin();throw new Error("401")}if(!r.ok)throw new Error("HTTP "+r.status);st=await r.json();emit()};
  const req=async(method,col,id,body)=>{
    let r;try{r=await fetch("api/docs/"+encodeURIComponent(col)+"/"+encodeURIComponent(id),{method,headers:{"Content-Type":"application/json","X-PT-User":encodeURIComponent(S.me||"")},body:body?JSON.stringify(body):undefined})}
    catch(e){throw{code:"unavailable",message:"Sunucuya ulaşılamadı"}}
    let j={};try{j=await r.json()}catch(e){}
    if(r.status===401){showLogin();throw{code:"unauthenticated",message:"Oturum süresi doldu"}}
    if(!r.ok)throw{code:(j.error&&j.error.code)||"unavailable",message:(j.error&&j.error.message)||r.statusText};
    apply({col,id,doc:method==="DELETE"?null:j.doc});
  };
  const sub=(col,id,cb)=>{const s={col,id,cb};subs.push(s);if(st)setTimeout(()=>cb(snapFor(s)));return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}};
  const docRef=(col,id)=>({id,path:col+"/"+id,set:d=>req("PUT",col,id,d),update:d=>req("PATCH",col,id,d),delete:()=>req("DELETE",col,id),onSnapshot:cb=>sub(col,id,cb)});
  const db={doc:p=>{const a=p.split("/");return docRef(a[0],a[1])},collection:col=>({path:col,doc:id=>docRef(col,id||uid("d")),onSnapshot:cb=>sub(col,null,cb)})};
  load().then(()=>{
    let es;const open=()=>{try{es=new EventSource("api/events");es.onmessage=e=>{try{apply(JSON.parse(e.data))}catch(x){}};es.onopen=()=>{load().then(()=>setSync(pending?"Kaydediliyor…":"Canlı · "+Object.keys(st.requests||{}).length+" talep")).catch(()=>{})};es.onerror=()=>setSync("Bağlantı yeniden kuruluyor…",true)}catch(e){}};
    open();setInterval(()=>load().catch(()=>{}),60000);
  }).catch(onFail);
  return db;
}
function blobDownloads(){return{save:async({filename,data})=>{const blob=new Blob([data],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:"saved"}}}}
function renderWho(){
  const b=$("#who");b.hidden=false;
  if(S.serverUser){b.textContent=(S.meDisplay||S.me)+(S.role?" · "+(ROLE_TR[S.role]||S.role):"");b.disabled=true;b.title="Şirket hesabıyla giriş yapıldı: "+S.me;return}
  b.textContent=S.me?S.me:"Adınızı girin";b.classList.toggle("need",!S.me);
}
function editWho(){
  if(S.serverUser)return;const b=$("#who");const inp=document.createElement("input");inp.className="who-in";inp.value=S.me||"";inp.placeholder="Ad Soyad";inp.setAttribute("aria-label","Adınız");
  b.hidden=true;b.after(inp);inp.focus();
  let fin=false;const done=save=>{if(fin)return;fin=true;if(save){S.me=inp.value.trim().slice(0,60);LS.set("me",S.me)}inp.remove();renderWho()};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")done(true);if(e.key==="Escape")done(false)});inp.addEventListener("blur",()=>done(true));
}
async function bootStandalone(){
  S.standalone=true;S.downloads=blobDownloads();S.me=LS.get("me","");
  try{const r=await fetch("api/me",{cache:"no-store"});
    if(r.status===401){showLogin();return}
    if(r.ok){const j=await r.json();
      if(j.user){S.me=j.user;S.meDisplay=j.display||j.user;S.serverUser=true}
      S.auth=!!j.auth;S.role=j.role||"";S.canManage=!!j.canManage;S.canApprove=!!j.canApprove;if(j.canRequest!==undefined)S.canRequest=!!j.canRequest;$("#logout").hidden=!S.auth||!!j.sso;
      if(j.readonly){S.canWrite=false;S.canWriteKnown=true;$("#ro").hidden=false;$("#ro").textContent=j.role==="engineer"?"Proje Mühendisi: \"Yeni talep\" ile talep oluşturabilirsiniz; talepleriniz Onaylar\'da bekler, yönetici onaylayınca Teslimatlar\'a ve Özet\'e girer.":j.role==="viewer"?"Görüntüleme yetkiniz var. Düzenleme yetkisi için Ar-Ge yöneticisine başvurun.":"Bu sunucu yalnızca okuma modunda çalışıyor."}
      else{S.canWriteKnown=true}}}catch(e){}
  renderWho();$("#who").addEventListener("click",editWho);
  setSync("Yükleniyor…");
  const db=restDb(()=>{setSync("Sunucuya ulaşılamadı",true);$("#view").innerHTML='<div class="empty"><h3>Sunucuya ulaşılamadı</h3>Prototip Takip sunucusu çalışmıyor ya da ağ bağlantısı yok. Sayfayı birkaç saniye sonra yenileyin; sorun sürerse IT ile görüşün.</div>'});
  S.db=db;
  db.collection("products").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.products=o;S.loaded.p=true;if(S.bomDraft&&!S.bomDraft._dirty)S.bomDraft=null;ready()});
  db.collection("requests").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.requests=o;S.loaded.r=true;ready()});
  db.doc("config/lists").onSnapshot(s=>{const d=s.exists?s.data():{};S.cfg={phases:d.phases||[],platforms:d.platforms||[],people:d.people||[],makers:d.makers||[],customers:d.customers||[],programs:d.programs||[],plan:d.plan||[]};ready()});
}
/* ---------- Giriş ---------- */
const ROLE_TR={viewer:"Görüntüleme",engineer:"Proje Mühendisi",editor:"Düzenleme",admin:"Yönetici",none:"Engelli"};
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&path!=="api/login"){showLogin();throw new Error("Oturum süresi doldu")}
  if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
  return j;
}
function showLogin(){
  if(loginShown)return;loginShown=true;S.db=null;
  ["#nav","#btnNew","#who","#logout","#filters","#ro"].forEach(s=>{const e=$(s);if(e)e.hidden=true});
  setSync("Giriş yapılmadı");$("#modal").innerHTML="";$("#bulk")&&($("#bulk").hidden=true);
  $("#view").innerHTML='<form class="login" id="loginForm" autocomplete="on"><h2>Prototip Takip</h2>'+
    '<p class="hint" style="margin:0">Şirket kullanıcı adınız ve şifrenizle (Windows girişi) giriş yapın.</p>'+
    '<label class="fl">Kullanıcı adı<input class="in" id="lgU" name="username" autocomplete="username" placeholder="ör. berkay.yilmaz" required autofocus></label>'+
    '<label class="fl">Şifre<input class="in" id="lgP" name="password" type="password" autocomplete="current-password" required></label>'+
    '<div id="lgE"></div><button class="btn dark" type="submit" id="lgB">Giriş yap</button></form>';
  $("#loginForm").addEventListener("submit",async e=>{
    e.preventDefault();const b=$("#lgB");b.disabled=true;b.textContent="Kontrol ediliyor…";$("#lgE").innerHTML="";
    try{await api("POST","api/login",{username:$("#lgU").value,password:$("#lgP").value});location.reload()}
    catch(x){$("#lgE").innerHTML='<div class="err" role="alert">'+esc(x.message)+'</div>';b.disabled=false;b.textContent="Giriş yap";$("#lgP").value="";$("#lgP").focus()}
  });
}

/* ---------- Yetki paneli (yalnızca yöneticiler) ---------- */
let ADM={users:null,err:"",busy:false,confirm:""};
function viewAdmin(){
  const u=ADM.users;const opts=(v,me)=>Object.entries(ROLE_TR).map(([k,l])=>'<option value="'+k+'"'+(k===v?" selected":"")+'>'+l+'</option>').join("");
  const when=s=>s?new Date(s).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
  const rows=!u?'<tr><td colspan="6" class="m">Yükleniyor…</td></tr>':u.users.map(x=>{
    const fixed=x.source==="local"||x.user===S.me;
    return '<tr><td><b>'+esc(x.display||x.user)+'</b><div class="m" style="color:var(--muted);font-size:12px">'+esc(x.user)+(x.source==="local"?" · yerel hesap":"")+(x.user===S.me?" · siz":"")+'</div></td>'+
      '<td>'+(fixed?'<span class="rtag">'+esc(ROLE_TR[x.role]||x.role)+'</span>':'<select class="in" data-urole="'+esc(x.user)+'" aria-label="'+esc(x.user)+' rolü">'+opts(x.role)+'</select>')+'</td>'+
      '<td class="m">'+when(x.lastLogin)+'</td><td class="m">'+esc(x.updatedBy||x.addedBy||"—")+'</td>'+
      '<td>'+(fixed?"":'<button type="button" class="btn'+(ADM.confirm===x.user?" danger":"")+'" data-urm="'+esc(x.user)+'">'+(ADM.confirm===x.user?"Emin misiniz?":"Kaldır")+'</button>')+'</td></tr>'}).join("");
  return '<section class="panel"><div class="ph"><h2>Yetkiler</h2><span class="sub">Şirket hesabıyla ilk kez giren herkes <b>'+esc(ROLE_TR[u?u.defaultRole:"viewer"]||"")+'</b> rolüyle eklenir. Yöneticiler başkalarına rol verebilir.</span></div>'+
    (ADM.err?'<div class="warn">'+esc(ADM.err)+'</div>':"")+
    '<form class="form" id="uAdd" style="margin:0;align-items:flex-end"><label class="fl">Kullanıcı adı<input class="in" id="uAddU" placeholder="ör. ahmet.kaya" style="width:220px" required></label>'+
    '<label class="fl">Rol<select class="in" id="uAddR">'+opts("editor")+'</select></label><button class="btn dark" type="submit">Ekle / güncelle</button></form>'+
    '<p class="hint" style="margin:0"><b>Görüntüleme:</b> Özet, Teslimatlar ve Ürünler\'i görür. <b>Proje Mühendisi:</b> talep oluşturur (yeni faz, fazsız teslimat, yeni ürün dahil); talep yönetici onayından sonra Teslimatlar\'a girer. <b>Düzenleme:</b> talep, parça ve durum değiştirir. <b>Yönetici:</b> düzenler, talepleri onaylar/reddeder ve bu sayfadan yetki verir. <b>Engelli:</b> giriş yapamaz.</p>'+
    '<div style="overflow-x:auto"><table class="utbl"><thead><tr><th>Kullanıcı</th><th>Rol</th><th>Son giriş</th><th>Son değiştiren</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}
async function loadAdmin(){
  if(ADM.busy)return;ADM.busy=true;
  try{const j=await api("GET","api/admin/users");ADM.users=j;ADM.err=""}catch(e){ADM.err=e.message}
  ADM.busy=false;setYcont("kullanici",viewAdmin);
}
async function adminDo(method,user,body,msg){
  try{const j=await api(method,"api/admin/users/"+encodeURIComponent(user),body);ADM.users.users=j.users;ADM.err="";ADM.confirm="";toast(msg)}
  catch(e){ADM.err=e.message;toast(e.message,true)}
  setYcont("kullanici",viewAdmin);
}
function fmtDT(s){return s?new Date(s).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):""}
async function approveReq(rid){
  const r=S.requests[rid];if(!r)return;const patch={approval:{state:"approved"},updatedAt:nowISO()};
  if(r.proposedProduct&&!S.products[r.product]){const pp=r.proposedProduct;
    const ok=await write("products/"+r.product,()=>S.db.collection("products").doc(r.product).set(stamp({name:pp.name,customer:pp.customer||custOf(r),program:pp.program||"",codes:pp.codes||{},parts:pp.parts||[],ord:Math.max(0,...Object.values(S.products).map(p=>p.ord||0))+1})));
    if(!ok)return;patch.proposedProduct=null}
  if(r.proposedPlan&&r.proposedPlan.phase){   // önerilen yeni faz onayla birlikte faz planına eklenir
    const x=Object.assign({},r.proposedPlan);x.platform=x.platform||x.customer;x.due=x.due||null;
    const ex=planMatch(x),cfg={};let id;
    if(ex)id=ex.id;else{id=planIdFor(x);cfg.plan=[...(S.cfg.plan||[]),{id,customer:x.customer,phase:x.phase,platform:x.platform,due:x.due}]}
    if(!S.cfg.phases.includes(x.phase))cfg.phases=[...S.cfg.phases,x.phase];if(x.platform&&!S.cfg.platforms.includes(x.platform))cfg.platforms=[...S.cfg.platforms,x.platform];
    if(Object.keys(cfg).length&&!await saveCfg(cfg))return;patch.planId=id;patch.proposedPlan=null}
  if(r.adhoc&&r.platform&&!S.cfg.platforms.includes(r.platform))await saveCfg({platforms:[...S.cfg.platforms,r.platform]});
  if(await write("requests/"+rid,()=>reqRef(rid).update(patch),prodOf(r).name+" · "+phaseName(r)+" onaylandı"))render();
}
let RJ=null;
function openReject(rid){const r=S.requests[rid];if(!r)return;RJ={rid};
  $("#modal").innerHTML='<div class="scrim" id="rjScrim"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="rjT" style="width:min(520px,100%)"><div class="dh"><h2 id="rjT">Talebi reddet</h2><span class="muted" style="font-size:12.5px">'+esc(prodOf(r).name)+' · '+esc(phaseName(r))+'</span></div>'+
   '<div class="db"><label class="fl">Neden (talebi açan kişi görecek)<textarea class="in" id="rjReason" rows="3" style="height:auto;padding:6px 8px" placeholder="ör. Adet DVP planıyla uyuşmuyor, 60 olmalı"></textarea></label></div>'+
   '<div class="df"><span class="grow"></span><button type="button" class="btn" id="rjNo">Vazgeç</button><button type="button" class="btn danger" id="rjGo">Reddet</button></div></div></div>';
  $("#rjReason").focus();
  $("#rjNo").onclick=()=>{RJ=null;$("#modal").innerHTML=""};
  $("#rjGo").onclick=async()=>{const why=$("#rjReason").value.trim();if(!why){toast("Ret nedenini yazın.",true);return}
    if(await write("requests/"+rid,()=>reqRef(rid).update({approval:{state:"rejected",reason:why},updatedAt:nowISO()}),"Talep reddedildi")){RJ=null;$("#modal").innerHTML="";render()}};
}
function bindApproval(){
  $("#view").addEventListener("click",e=>{const a=e.target.closest("[data-approve]"),j=e.target.closest("[data-reject]");
    if(a){e.stopPropagation();approveReq(a.dataset.approve)}else if(j){e.stopPropagation();openReject(j.dataset.reject)}},true);
  $("#pendBtn").addEventListener("click",()=>{S.on.tab="rejected";S.on.sel=null;setTab("onay")});
}
function bindPlan(){
  const v=$("#view");
  v.addEventListener("change",e=>{const t=e.target;if(t.dataset.plandue!==undefined){setPlanDue(+t.dataset.plandue,t.value)}});
  v.addEventListener("click",e=>{const b=e.target.closest("[data-planrm]");if(!b)return;const pl=(S.cfg.plan||[]).filter((_,i)=>i!==+b.dataset.planrm);saveCfg({plan:pl})});
  v.addEventListener("submit",e=>{const f=e.target.closest("#planAdd");if(!f)return;e.preventDefault();e.stopPropagation();
    const c=$("#paC").value,ph=$("#paP").value.trim(),s=$("#paS").value.trim()||c,d=$("#paD").value||null;if(!ph)return;
    const id=trLower(c+"-"+ph+"-"+s).replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    if((S.cfg.plan||[]).some(x=>x.id===id)){toast("Bu satır zaten var.",true);return}
    const patch={plan:[...(S.cfg.plan||[]),{id,customer:c,phase:ph,platform:s,due:d}]};
    if(!S.cfg.phases.includes(ph))patch.phases=[...S.cfg.phases,ph];if(s&&!S.cfg.platforms.includes(s))patch.platforms=[...S.cfg.platforms,s];
    saveCfg(patch).then(ok=>ok&&toast("Faz planına eklendi: "+planLabel(patch.plan[patch.plan.length-1])))},true);
}
function bindAdmin(){
  const v=$("#view");
  v.addEventListener("change",e=>{const s=e.target.closest("[data-urole]");if(!s||S.tab!=="yonetim")return;adminDo("PUT",s.dataset.urole,{role:s.value},s.dataset.urole+": "+ROLE_TR[s.value])});
  v.addEventListener("click",e=>{const b=e.target.closest("[data-urm]");if(!b||S.tab!=="yonetim")return;const u=b.dataset.urm;
    if(ADM.confirm!==u){ADM.confirm=u;setYcont("kullanici",viewAdmin);return}adminDo("DELETE",u,null,u+" kaldırıldı")});
  v.addEventListener("submit",e=>{const f=e.target.closest("#uAdd");if(!f)return;e.preventDefault();const u=$("#uAddU").value.trim(),r=$("#uAddR").value;if(u)adminDo("PUT",u,{role:r},u+": "+ROLE_TR[r])});
  $("#logout").addEventListener("click",async()=>{try{await api("POST","api/logout",{})}catch(e){}location.reload()});
}

function noDb(){setSync("Veritabanı yok",true);$("#view").innerHTML='<div class="empty"><h3>Paylaşılan veritabanına ulaşılamadı</h3>Bu sayfa verilerini claude.ai üzerindeki paylaşılan veritabanında tutar. Sayfayı claude.ai içinde açın; erişiminiz yoksa sayfa sahibinden paylaşım isteyin.</div>';$("#btnNew").hidden=true}
boot();
})();
