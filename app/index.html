<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sanel Prototip Takip</title>
</head>
<body>
<style>
/* Tek (açık) tema bilinçli seçim. Düzen: koyu logo şeridi → filtre çubuğu → özet satırı → Excel benzeri gruplu tablo / grafikler / ürünler. */
:root{
  color-scheme:light;
  --strip:#1F2A36; --strip-2:#3B4857; --strip-ink:#FFFFFF; --strip-mute:#AEB8C4;
  --bg:#FFFFFF; --head:#F5F6F7; --group:#EDEFF2; --line:#E6E8EB; --line-2:#CFD4DA;
  --ink:#1B2128; --ink-2:#4B535C; --muted:#6E7680;
  --s-row:#FFF7CF; --s-bar:#E1B400; --s-chip:#FFE78A; --s-ink:#5A4700;
  --f-row:#FFEBDD; --f-bar:#E8772E; --f-chip:#FFD2B3; --f-ink:#7A3410;
  --k-row:#E6EEF9; --k-bar:#4C82C3; --k-chip:#CFDDF2; --k-ink:#1C4A7E;
  --b-bar:#D33F49; --b-chip:#F9D0D3; --b-ink:#8A1822;
  --d-row:#E3F4E7; --d-bar:#2E9E55; --d-chip:#C9EBD1; --d-ink:#1C5E33;
  --late:#C62828; --soon:#B25A10; --order:#4C82C3; --prod:#7B5CC4; --cancel:#B8BEC5;
  --f-body:"IBM Plex Sans","Segoe UI",Tahoma,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow","Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font:13.5px/1.4 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--strip);outline-offset:1px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* Şerit */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--strip);color:var(--strip-ink)}
.strip-in{display:flex;align-items:center;gap:22px;height:52px;padding-inline:max(16px,2.2vw)}
.strip img{height:22px;width:auto;display:block}
.strip .sep{width:1px;height:22px;background:var(--strip-2)}
.nav{display:flex;height:52px;align-items:stretch}
.nav button{border:0;background:none;color:var(--strip-mute);padding:0 14px;font-size:14px;font-weight:500;cursor:pointer}
.nav button[aria-selected="true"]{color:var(--strip-ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--strip-ink)}
.nav button:hover{color:var(--strip-ink)}
.grow{flex:1}
.sync{font-size:12px;color:var(--strip-mute);white-space:nowrap}
.sync.err{color:#FFB4AE}
.btn-new{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;background:#FFFFFF;color:var(--strip);border:0;border-radius:4px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-new:hover{background:#E9EDF1}
.who{border:1px solid var(--strip-2);background:none;color:var(--strip-mute);height:30px;padding:0 10px;border-radius:4px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.who:hover{color:#FFFFFF;border-color:var(--strip-mute)}
.who.need{color:#FFD9A8;border-color:#FFD9A8}
.who-in{height:30px;border:0;border-radius:4px;padding:0 8px;font-size:13px;width:150px}

/* Filtre */
.wrap{padding-inline:max(16px,2.2vw)}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;min-width:0}
.in{height:32px;border:1px solid var(--line-2);border-radius:3px;padding:0 8px;background:#FFFFFF;font-size:13px;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0;min-width:0}
select.in{padding-right:6px}
.seg{display:flex;height:32px;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line-2);background:#FFFFFF;padding:0 12px;font-size:13px;cursor:pointer;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--strip);color:#FFFFFF;font-weight:600}
.btn{height:32px;padding:0 12px;border:1px solid var(--line-2);background:#FFFFFF;border-radius:3px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--strip)}
.btn.dark{background:var(--strip);border-color:var(--strip);color:#FFFFFF;font-weight:600}
.btn.danger{color:var(--late);border-color:#E5A3A3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--strip);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.link:hover{color:#000}

/* Özet */
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px;font-size:13px}
.sum b{font-family:var(--f-mono);font-weight:600}
.sum button{border:0;background:none;padding:2px 4px;margin:-2px -4px;border-radius:3px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.sum button:hover{background:var(--head)}
.sum button[aria-pressed="true"]{background:var(--group);box-shadow:inset 0 0 0 1px var(--line-2)}
.sq{width:9px;height:9px;border-radius:2px;flex-shrink:0;display:inline-block}
.pbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#EEF0F2;width:min(360px,100%)}
.pbar span{display:block;height:100%}

/* Tablo */
.tbl{border:1px solid var(--line);border-radius:4px;overflow-x:auto;margin-bottom:28px}
.grid{min-width:1180px}
.row{display:grid;grid-template-columns:34px minmax(150px,1.3fr) 96px minmax(120px,1fr) minmax(140px,1.2fr) 64px 64px 110px 176px minmax(160px,1.6fr) 30px;align-items:center;min-height:34px;border-bottom:1px solid var(--line);position:relative}
.row>div{padding:0 6px;min-width:0}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.row.h{min-height:32px;background:var(--head);font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;position:sticky;top:0;z-index:2}
.t-Sanel{background:var(--s-row)}.t-Sanel::before{background:var(--s-bar)}
.t-Alt{background:var(--f-row)}.t-Alt::before{background:var(--f-bar)}
.t-Stok{background:var(--k-row)}.t-Stok::before{background:var(--k-bar)}
.t-Belirsiz::before{background:var(--b-bar)}
.row.done{background:var(--d-row)}.row.done::before{background:var(--d-bar)}
.row.cancel{background:#FFFFFF;color:var(--cancel)}.row.cancel::before{background:var(--cancel)}
.row.cancel .c-part{text-decoration:line-through}
.row.sel{box-shadow:inset 0 0 0 2px var(--strip)}
.gh{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;min-height:40px;padding:6px 12px 6px 10px;background:var(--group);border-bottom:1px solid #DDE1E5;cursor:pointer}
.gh h3{margin:0;font:700 15px/1.2 var(--f-cond)}
.gh .meta{font-size:12.5px;color:var(--ink-2)}
.gh .acts{display:flex;gap:14px;align-items:center;margin-left:auto}
.caret{width:14px;color:var(--muted);transition:transform .12s}
.g.closed .caret{transform:rotate(-90deg)}
.g.closed .gb{display:none}
.days{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap}
.days.late{background:var(--late);color:#FFFFFF}.days.soon{color:var(--soon);box-shadow:inset 0 0 0 1px var(--soon)}.days.ok{color:var(--ink-2);background:#FFFFFF}
.gnote{padding:7px 12px 7px 44px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cell{width:100%;height:28px;border:1px solid transparent;background:transparent;border-radius:3px;padding:0 6px;font-size:13px;min-width:0;text-overflow:ellipsis}
.cell:hover:not(:disabled){border-color:var(--line-2);background:#FFFFFF}
.cell:focus{border-color:var(--strip);background:#FFFFFF;outline:none}
.cell:disabled{color:inherit;cursor:default}
.cell.n{text-align:right;font-family:var(--f-mono)}
.cell.b{font-weight:600}
select.cell{appearance:none;-webkit-appearance:none;cursor:pointer}
select.tp{width:auto;height:22px;font-size:11.5px;font-weight:600;padding:0 7px;border-radius:3px;border:0}
select.tp:hover:not(:disabled){box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tp-Sanel{background:var(--s-chip);color:var(--s-ink)}.tp-Alt{background:var(--f-chip);color:var(--f-ink)}.tp-Stok{background:var(--k-chip);color:var(--k-ink)}.tp-Belirsiz{background:var(--b-chip);color:var(--b-ink)}
.st{display:flex;align-items:center;gap:7px;width:100%;height:26px;border:1px solid var(--line-2);background:#FFFFFF;border-radius:3px;padding:0 8px;font-size:12.5px;font-weight:500;cursor:pointer;text-align:left}
.st:hover:not(:disabled){border-color:var(--strip)}
.st:disabled{cursor:default}
.st span.l{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq-open{background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #8A939D}.sq-wait{background:var(--f-bar)}.sq-order{background:var(--order)}.sq-prod{background:var(--prod)}.sq-done{background:var(--d-bar)}.sq-cancel{background:var(--cancel)}
.rm{border:0;background:none;color:transparent;cursor:pointer;width:24px;height:24px;border-radius:3px;font-size:13px}
.row:hover .rm{color:var(--muted)}
.rm:hover,.rm:focus{color:var(--late)!important;background:#FFFFFF}
.rm.arm{color:#FFFFFF!important;background:var(--late);width:auto;padding:0 6px;font-size:11.5px;font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:600;color:var(--late);margin-right:6px;white-space:nowrap}

/* Menü */
.menu{position:fixed;z-index:60;width:216px;background:#FFFFFF;border:1px solid var(--line-2);border-radius:4px;box-shadow:0 8px 24px rgba(20,30,40,.16);padding:4px 0}
.menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 12px;font-size:13px;cursor:pointer;text-align:left}
.menu button:hover,.menu button:focus{background:var(--head);outline:none}
.menu button[aria-checked="true"]{font-weight:600}

/* Toplu */
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--strip);color:#FFFFFF;border-radius:6px;padding:8px 10px 8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);font-size:13px}
.bulk select,.bulk input{height:30px;border:0;border-radius:3px;padding:0 6px;background:#FFFFFF;color:var(--ink);font-size:13px}
.bulk .btn{height:30px;border:0}
.bulk .ghost{background:none;color:var(--strip-mute);border:0;cursor:pointer}

/* Grafik */
.charts{display:flex;flex-direction:column;gap:20px;padding-block:18px 32px}
.panel{border:1px solid var(--line);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px}
.ph h2{margin:0;font:700 17px var(--f-cond)}
.ph .sub{font-size:12.5px;color:var(--muted)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.c3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:1100px){.c3{grid-template-columns:1fr}}
.gantt{overflow-x:auto}
.gantt-in{min-width:760px;display:grid;grid-template-columns:160px minmax(0,1fr)}
.gl{height:32px;display:flex;align-items:center;font-size:13px;font-weight:600;border-bottom:1px solid #F0F1F3;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gl small{font-weight:400;color:var(--muted);margin-left:6px;font-size:11.5px}
.gt{position:relative;height:32px;border-bottom:1px solid #F0F1F3}
.gline{position:absolute;top:50%;height:2px;margin-top:-1px;background:#D5D9DE}
.ms{position:absolute;top:50%;width:13px;height:13px;margin:-6px 0 0 -6px;transform:rotate(45deg);border:2px solid #FFFFFF;cursor:pointer;padding:0}
.ms-done{background:var(--d-bar)}.ms-late{background:var(--late)}.ms-soon{background:var(--f-bar)}.ms-next{background:#FFFFFF;border-color:#6B7580}
.ml{position:absolute;top:0;transform:translateX(-50%);font:600 10px var(--f-mono);color:var(--ink-2);white-space:nowrap;pointer-events:none}
.axis{position:relative;height:22px;border-bottom:1px solid #D5D9DE}
.axis span{position:absolute;bottom:3px;font:11px var(--f-mono);color:var(--muted);padding-left:4px;border-left:1px solid #D5D9DE;height:16px}
.today{position:absolute;top:0;bottom:0;border-left:2px dashed var(--strip);pointer-events:none}
.today b{position:absolute;top:-22px;left:0;transform:translateX(-50%);font:600 10.5px var(--f-mono);background:var(--strip);color:#FFFFFF;padding:2px 6px;border-radius:2px;white-space:nowrap}
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 78px;align-items:center;gap:10px;height:26px;font-size:13px;border:0;background:none;width:100%;padding:0;text-align:left;cursor:pointer;border-radius:3px}
.hb:hover{background:var(--head)}
.hb .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{display:flex;height:14px;background:#F2F3F5}
.hb .v{font:12px var(--f-mono);text-align:right;color:var(--ink-2)}

/* Ürünler */
.prod{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;padding-block:18px 32px}
@media (max-width:760px){.prod{grid-template-columns:1fr}}
.plist{border:1px solid var(--line);border-radius:4px;padding:6px;align-self:start}
.plist h4{margin:10px 8px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.plist button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;text-align:left;padding:7px 9px;border-radius:3px;cursor:pointer;font-size:13.5px}
.plist button:hover{background:var(--head)}
.plist button[aria-current="true"]{background:var(--strip);color:#FFFFFF;font-weight:600}
.plist button small{font:11.5px var(--f-mono);opacity:.7}
.form{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.bomrow{display:grid;grid-template-columns:minmax(150px,1.3fr) 110px 110px minmax(120px,1fr) minmax(130px,1fr) 120px 34px;align-items:center;min-height:34px;border-bottom:1px solid var(--line);position:relative;min-width:780px}
.bomrow>div{padding:0 6px}
.bomrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.hint{font-size:12.5px;color:var(--muted);max-width:75ch;margin:0 0 12px}
.dirty{font-size:12.5px;color:var(--soon);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:2px;background:var(--head);border:1px solid var(--line);border-radius:3px;padding:3px 3px 3px 9px;font-size:13px}
.tag button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 5px;font-size:15px;line-height:1}
.tag button:hover{color:var(--late)}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* Panel (çekmece) */
.scrim{position:fixed;inset:0;background:rgba(20,28,36,.42);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:#FFFFFF;width:min(820px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(10,16,22,.18)}
.dh{display:flex;align-items:center;gap:12px;padding:0 24px;min-height:62px;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.dh h2{margin:0;font:700 20px var(--f-cond)}
.dh .x{margin-left:auto;width:36px;height:36px;border:0;background:none;cursor:pointer;color:var(--ink-2);border-radius:3px}
.dh .x:hover{background:var(--head)}
.db{flex:1;overflow:auto;padding:18px 24px;display:flex;flex-direction:column;gap:18px}
.db>*{flex-shrink:0}
.df{display:flex;align-items:center;gap:10px;padding:12px 24px;border-top:1px solid var(--line);flex-wrap:wrap;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cg{width:100%;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:4px;display:flex;gap:10px;align-items:center}
.chip{height:32px;padding:0 12px;border:1px solid var(--line-2);background:#FFFFFF;border-radius:3px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--strip);border-color:var(--strip);color:#FFFFFF;font-weight:600}
.pv{border:1px solid var(--line);border-radius:4px;overflow-x:auto}
.pvh{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 12px;background:var(--group);border-bottom:1px solid #DDE1E5;flex-wrap:wrap}
.pvh b{font:700 14.5px var(--f-cond)}
.prow{display:grid;grid-template-columns:32px minmax(130px,1.2fr) 52px 76px 104px minmax(110px,1fr) minmax(120px,1fr) 104px;align-items:center;min-height:34px;border-bottom:1px solid var(--line);position:relative;min-width:720px}
.prow>div{padding:0 5px}
.prow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.prow.off{opacity:.45}
.warn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FDECEC;color:#8A1822;border-radius:3px;padding:8px 10px;font-size:13px}

.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:4px;margin-block:10px 28px}
.empty h3{margin:0 0 6px;font:700 17px var(--f-cond);color:var(--ink)}
.banner{background:#EEF2F6;border-radius:3px;padding:8px 12px;font-size:13px;margin-top:12px}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--strip);color:#FFFFFF;padding:9px 14px;border-radius:4px;z-index:70;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--late)}
@media (max-width:640px){.strip .sep,.sync,.lbl-new,.who{display:none}.btn-new{padding:0 10px}.strip img{height:18px}.strip-in{gap:12px}.nav button{padding:0 9px}.fl.q{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const dnum=iso=>iso?Math.round(new Date(iso+"T00:00:00").getTime()/864e5):null;
const dayDiff=iso=>iso?dnum(iso)-dnum(todayISO()):null;
const fmtD=iso=>iso?iso.slice(8,10)+"."+iso.slice(5,7)+"."+iso.slice(0,4):"—";

const S={db:null,user:null,me:null,canWrite:true,loaded:{p:false,r:false},downloads:null,
  products:{},requests:{},cfg:{phases:[],platforms:[],people:[],makers:[],customers:[],programs:[]},
  tab:LS.get("tab","liste"),
  f:Object.assign({customer:"Ford",phase:"Yellow Board (19.10)",product:"",status:"open",owner:"",type:"",q:""},LS.get("f",{})),
  sel:new Set(),closed:new Set(LS.get("closed",[])),bomSel:null,bomDraft:null,names:{}};

/* ---------- Veri türetme ---------- */
const prodOf=r=>S.products[r.product]||{name:r.product||"?",program:"",customer:"",ord:99,parts:[]};
function allItems(){
  const out=[];
  for(const [rid,r] of Object.entries(S.requests)){
    if(r.deleted)continue;const p=prodOf(r);
    for(const [iid,it] of Object.entries(r.items||{})){
      if(!it||it.deleted)continue;
      const due=it.due||r.due||null;
      out.push({rid,iid,r,it,p,due,days:dayDiff(due),done:DONE.includes(it.status),cancel:it.status==="İptal",type:normT(it.type)});
    }
  }
  return out;
}
const isOpen=x=>!x.done&&!x.cancel;
const isLate=x=>isOpen(x)&&x.days!=null&&x.days<0;
const isSoon=x=>isOpen(x)&&x.days!=null&&x.days>=0&&x.days<=7;
function reqPass(r,f,skip){
  skip=skip||{};const p=prodOf(r);
  if(f.customer&&(p.customer||"—")!==f.customer)return false;
  if(!skip.phase&&f.phase&&r.phase!==f.phase)return false;
  if(!skip.product&&f.product&&r.product!==f.product)return false;
  return true;
}
function passes(x,f,skip){
  skip=skip||{};
  if(!reqPass(x.r,f,skip))return false;
  if(!skip.type&&f.type&&x.type!==f.type)return false;
  if(!skip.owner&&f.owner&&(x.it.owner||"(atanmamış)")!==f.owner)return false;
  if(!skip.status){
    if(f.status==="open"&&!isOpen(x))return false;
    if(f.status==="late"&&!isLate(x))return false;
    if(f.status==="done"&&!x.done)return false;
  }
  if(f.q){const h=trLower([x.it.part,x.p.name,x.it.maker,x.it.material,x.it.note,x.r.phase,x.it.owner].join(" "));if(!h.includes(trLower(f.q)))return false}
  return true;
}

/* ---------- Yazma ---------- */
const queues={};let pending=0;
function enqueue(path,fn){const p=(queues[path]||Promise.resolve()).then(fn,fn);queues[path]=p.catch(()=>{});return p}
function setSync(t,err){const el=$("#sync");el.textContent=t;el.classList.toggle("err",!!err)}
async function write(path,fn,okMsg){
  if(!S.db){toast("Veritabanına bağlı değil; değişiklik kaydedilmedi.",true);return false}
  if(S.standalone&&!S.me&&!S.askedName){S.askedName=true;toast("Değişikliklerin kimden geldiği görünsün diye sağ üstten adınızı girin.")}
  pending++;setSync("Kaydediliyor…");
  try{await enqueue(path,fn);if(okMsg)toast(okMsg);return true}
  catch(e){if(e&&e.code==="invalid_argument"&&!S.canWriteKnown){S.canWrite=false;$("#ro").hidden=false;render()}toast(errText(e),true);return false}
  finally{pending--;if(!pending)setSync("Kaydedildi · canlı")}
}
function errText(e){const c=e&&e.code;return c==="quota_exceeded"?"Veritabanı dolu; eski talepleri silin.":c==="resource_exhausted"?"Çok hızlı işlem yapıldı, birkaç saniye sonra tekrar deneyin.":c==="invalid_argument"?"Kaydedilemedi: düzenleme yetkiniz yok.":"Kaydedilemedi; bağlantıyı kontrol edip tekrar deneyin."}
function stamp(o){o.updatedAt=nowISO();if(S.me)o.by=S.me;return o}
const reqRef=rid=>S.db.collection("requests").doc(rid);
function updItem(rid,iid,patch){return write("requests/"+rid,()=>reqRef(rid).update({items:{[iid]:stamp(Object.assign({},patch))},updatedAt:nowISO()}))}
function updItemsBulk(targets,patch){
  const by={};for(const t of targets)(by[t.rid]=by[t.rid]||[]).push(t.iid);
  return Promise.all(Object.entries(by).map(([rid,iids])=>{const items={};for(const i of iids)items[i]=stamp(Object.assign({},patch));return write("requests/"+rid,()=>reqRef(rid).update({items,updatedAt:nowISO()}))}));
}
const saveCfg=patch=>{const body=Object.assign({},S.cfg,patch);return write("config/lists",()=>S.db.collection("config").doc("lists").set(body))};
let tt;function toast(m,err){$("#toast").innerHTML='<div class="toast'+(err?" err":"")+'" role="status">'+esc(m)+'</div>';clearTimeout(tt);tt=setTimeout(()=>$("#toast").innerHTML="",err?5000:2200)}
const canEdit=()=>S.canWrite&&!!S.db;
const D=()=>canEdit()?"":" disabled";
function opts(list,val,blank){const l=[...list];if(val&&!l.includes(val))l.push(val);return (blank!=null?'<option value="">'+esc(blank)+'</option>':"")+l.map(v=>'<option'+(v===val?" selected":"")+'>'+esc(v)+'</option>').join("")}

   '<label class="fl q" style="flex:1;min-width:180px">Ara<input class="in" id="fQ" type="search" placeholder="Parça, malzeme, üretici, not…" value="'+esc(f.q)+'"></label>'+

function bindFilters(){
  const el=$("#filters");
  el.addEventListener("change",e=>{const t=e.target;
    if(t.id==="fCust"){S.f.customer=t.value;S.f.product=""}else if(t.id==="fPhase")S.f.phase=t.value;else if(t.id==="fProd")S.f.product=t.value;else if(t.id==="fOwn")S.f.owner=t.value;else return;

/* ---------- Liste ---------- */
function summary(list){
  const tot=list.length,done=list.filter(x=>x.done).length,cancel=list.filter(x=>x.cancel).length,open=list.filter(isOpen);
  const by=t=>open.filter(x=>x.type===t).length;const late=open.filter(isLate).length,soon=open.filter(isSoon).length;
  const base=Math.max(1,tot-cancel),pct=Math.round(done/base*100);const seg=(n,c)=>n?'<span style="width:'+(n/base*100)+'%;background:'+c+'"></span>':"";
  const tb=t=>by(t)||S.f.type===t?'<button type="button" data-type="'+t+'" aria-pressed="'+(S.f.type===t)+'" title="Yalnızca bunları göster"><span class="sq" style="background:'+TYPE_BAR[t]+'"></span>'+TYPE_LBL[t]+' <b>'+by(t)+'</b></button>':"";
  return '<div class="sum" id="sum"><span><b style="font-size:15px">'+tot+'</b> kalem</span><span style="display:flex;align-items:center;gap:6px"><span class="sq sq-done"></span><b>'+done+'</b> bitti</span>'+
    tb("Sanel")+tb("Alt Tedarikçi")+tb("Stok")+tb("Belirsiz")+
    (late?'<span style="color:var(--late);font-weight:600">Termini geçen <b>'+late+'</b></span>':'<span class="muted">Termini geçen yok</span>')+
    (soon?'<span style="color:var(--soon);font-weight:600">7 gün içinde <b>'+soon+'</b></span>':"")+
    '<span class="grow"></span><span class="pbar" aria-hidden="true">'+seg(done,"var(--d-bar)")+seg(by("Sanel"),"var(--s-bar)")+seg(by("Alt Tedarikçi"),"var(--f-bar)")+seg(by("Stok"),"var(--k-bar)")+seg(by("Belirsiz"),"var(--b-bar)")+'</span><b>%'+(tot?pct:0)+'</b></div>';
}
function daysTag(d){if(d==null)return"";return '<span class="days '+(d<0?"late":d<=7?"soon":"ok")+'">'+(d<0?(-d)+" gün geçti":d===0?"bugün":d+" gün kaldı")+'</span>'}
function viewList(){
  const f=S.f;const all=allItems();
  const list=all.filter(x=>passes(x,f));
  const forSum=all.filter(x=>passes(x,f,{status:1,type:1}));
  const byReq={};for(const x of list)(byReq[x.rid]=byReq[x.rid]||[]).push(x);
  const totByReq={};for(const x of all)(totByReq[x.rid]=totByReq[x.rid]||[]).push(x);
  // Alt parçası olmayan talepler (ör. STI) ek filtre yokken gösterilir
  const noFilter=!f.type&&!f.owner&&!f.q&&(f.status==="open"||f.status==="all");
  const rids=Object.keys(S.requests).filter(rid=>{const r=S.requests[rid];if(r.deleted||!reqPass(r,f))return false;return byReq[rid]||(noFilter&&!(totByReq[rid]||[]).length)})
    .sort((a,b)=>{const A=S.requests[a],B=S.requests[b];return (A.due||"9999").localeCompare(B.due||"9999")||(prodOf(A).ord||0)-(prodOf(B).ord||0)});
  let html=summary(forSum);
  if(!rids.length)return html+emptyState();
  html+='<div class="tbl"><div class="grid"><div class="row h"><div><input type="checkbox" class="cb" id="selAll" aria-label="Görünen tüm kalemleri seç"'+(list.length&&list.every(x=>S.sel.has(x.rid+"/"+x.iid))?" checked":"")+'></div><div>Parça</div><div>Tip</div><div>Üretici</div><div>Ham madde / Rev</div><div style="text-align:right">Adet</div><div style="text-align:right">Teslim</div><div>Sorumlu</div><div>Durum</div><div>Not</div><div></div></div>';
  for(const rid of rids){
    const r=S.requests[rid],p=prodOf(r),xs=(byReq[rid]||[]).sort((a,b)=>(a.it.ord||0)-(b.it.ord||0)),tot=totByReq[rid]||[];
    const done=tot.filter(x=>x.done).length,base=tot.filter(x=>!x.cancel).length,hidden=tot.length-xs.length,anyOpen=tot.some(isOpen)||!tot.length;
    const qty=r.sets?r.sets+" araç seti":r.direct?r.direct+" adet":"";
    const meta=[p.customer||"Müşteri belirtilmemiş",p.program,r.phase,r.platform!==r.phase?r.platform:"",qty,"Termin "+fmtD(r.due)].filter(Boolean).map(esc).join(" · ");
    html+='<div class="g'+(S.closed.has(rid)?" closed":"")+'" data-g="'+esc(rid)+'"><div class="gh" data-toggle="'+esc(rid)+'" aria-expanded="'+!S.closed.has(rid)+'">'+
      '<svg class="caret" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 5l4 4 4-4"/></svg>'+
      '<h3>'+esc(p.name)+'</h3><span class="meta">'+meta+'</span>'+(anyOpen?daysTag(dayDiff(r.due)):"")+
      '<span class="acts"><span class="num" style="font-size:12px;color:var(--ink-2)">'+done+' / '+base+' bitti</span>'+
      (canEdit()?'<button type="button" class="link" data-add="'+esc(rid)+'">+ Parça</button><button type="button" class="link" data-edit="'+esc(rid)+'">Düzenle</button>':"")+'</span></div><div class="gb">';
    for(const x of xs)html+=rowHtml(x);
    if(!tot.length)html+='<div class="gnote">Bu talepte alt parça tanımlı değil.'+(canEdit()?' <button type="button" class="link" data-add="'+esc(rid)+'">Parça ekle</button>':"")+'</div>';
    else if(hidden>0)html+='<div class="gnote">'+hidden+' kalem filtre nedeniyle gizli'+(f.status==="open"?" (bitenler)":"")+'.</div>';
    html+='</div></div>';
  }
  return html+'</div></div>'+datalists();
}

function viewCharts(){
  const f=S.f;const all=allItems();const list=all.filter(x=>passes(x,f,{status:1}));
  const reqs=Object.entries(S.requests).filter(([,r])=>!r.deleted&&reqPass(r,f,{phase:1}));
  // Gantt: ürün başına faz terminleri
  const byProd={};for(const [rid,r] of reqs){if(!r.due)continue;(byProd[r.product]=byProd[r.product]||[]).push([rid,r])}
  const tk=todayISO(),dates=[tk];for(const v of Object.values(byProd))for(const [,r] of v)dates.push(r.due);
  dates.sort();let lo=dnum(dates[0])-10,hi=dnum(dates[dates.length-1])+14;if(hi-lo<60)hi=lo+60;
  const X=iso=>((dnum(iso)-lo)/(hi-lo)*100).toFixed(2)+"%";
  const months=[];{const a=new Date(lo*864e5),b=new Date(hi*864e5);let d=new Date(a.getFullYear(),a.getMonth()+1,1);const M=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];while(d<=b){const iso=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-01";months.push('<span style="left:'+X(iso)+'">'+M[d.getMonth()]+(d.getMonth()===0?" "+String(d.getFullYear()).slice(2):"")+'</span>');d=new Date(d.getFullYear(),d.getMonth()+1,1)}}
  const itemsByReq={};for(const x of all)(itemsByReq[x.rid]=itemsByReq[x.rid]||[]).push(x);

    }

  }
  const gantt=prodIds.length?'<div class="gantt"><div class="gantt-in"><div></div><div class="axis">'+months.join("")+'</div>'+gRows+
    '<div></div><div style="position:relative;height:0"><div class="today" style="left:'+X(tk)+';top:-'+(prodIds.length*32)+'px;height:'+(prodIds.length*32)+'px"><b>Bugün '+fmtD(tk).slice(0,5)+'</b></div></div></div></div>':'<p class="muted">Terminli talep yok.</p>';

  // İlerleme
  const pr={};for(const x of list){const k=x.r.product;const o=pr[k]=pr[k]||{done:0,Sanel:0,"Alt Tedarikçi":0,Stok:0,Belirsiz:0,cancel:0};if(x.cancel)o.cancel++;else if(x.done)o.done++;else o[x.type]++}
  const prIds=Object.keys(pr).sort((a,b)=>(prodOf({product:a}).ord||0)-(prodOf({product:b}).ord||0));
  const pmax=Math.max(1,...prIds.map(k=>{const o=pr[k];return o.done+o.Sanel+o["Alt Tedarikçi"]+o.Stok+o.Belirsiz}));
  const w=n=>(n/pmax*100).toFixed(1)+"%";
  const progress=prIds.map(k=>{const o=pr[k],t=o.done+o.Sanel+o["Alt Tedarikçi"]+o.Stok+o.Belirsiz;return '<button type="button" class="hb" data-cprod="'+esc(k)+'" title="Listede göster"><span class="nm">'+esc(prodOf({product:k}).name)+'</span><span class="tr"><span style="width:'+w(o.done)+';background:var(--d-bar)"></span><span style="width:'+w(o.Sanel)+';background:var(--s-bar)"></span><span style="width:'+w(o["Alt Tedarikçi"])+';background:var(--f-bar)"></span><span style="width:'+w(o.Stok)+';background:var(--k-bar)"></span><span style="width:'+w(o.Belirsiz)+';background:var(--b-bar)"></span></span><span class="v">'+o.done+' / '+t+'</span></button>'}).join("")||'<p class="muted">Kalem yok.</p>';
  // Sorumlu

  const owIds=Object.keys(ow).sort((a,b)=>ow[b]-ow[a]);const omax=Math.max(1,...Object.values(ow));
  const owners=owIds.map(k=>'<button type="button" class="hb" data-cown="'+esc(k)+'" title="Listede göster"><span class="nm"'+(k==="(atanmamış)"?' style="color:var(--b-ink)"':"")+'>'+esc(k==="(atanmamış)"?"Atanmamış":k)+'</span><span class="tr"><span style="width:'+(ow[k]/omax*100).toFixed(1)+'%;background:'+(k==="(atanmamış)"?"var(--b-bar)":"#3E4C5B")+'"></span></span><span class="v">'+ow[k]+'</span></button>').join("")||'<p class="muted">Açık kalem yok.</p>';
  // Üretici

  const mkIds=Object.keys(mk).sort((a,b)=>mk[b].q-mk[a].q);const mmax=Math.max(1,...mkIds.map(k=>mk[k].q));
  const makers=mkIds.map(k=>{const o=mk[k];const c=k==="(belirsiz)"?"var(--b-bar)":k==="Sanel"?"var(--s-bar)":"var(--f-bar)";return '<button type="button" class="hb" style="grid-template-columns:130px minmax(0,1fr) 96px" data-cmk="'+esc(k)+'" title="Listede göster"><span class="nm">'+esc(k==="(belirsiz)"?"Belirsiz":k)+'</span><span class="tr"><span style="width:'+(o.q/mmax*100).toFixed(1)+'%;background:'+c+'"></span></span><span class="v">'+o.q.toLocaleString("tr-TR")+' ('+o.n+')</span></button>'}).join("")||'<p class="muted">Açık kalem yok.</p>';
  const unassigned=ow["(atanmamış)"]||0;
  const L=(c,t)=>'<span class="lg"><span class="sq" style="background:'+c+'"></span>'+t+'</span>';
  return '<div class="charts">'+
    '<section class="panel" aria-label="Termin çizelgesi"><div class="ph"><h2>Termin çizelgesi</h2><span class="sub">Her işaret bir fazın termini'+(f.phase?" · seçili faz çerçeveli":"")+'</span><span class="grow"></span>'+L("var(--d-bar)","Bitti")+L("var(--late)","Termini geçti, eksik var")+L("var(--f-bar)","14 gün içinde")+'<span class="lg"><span class="sq" style="background:#FFFFFF;box-shadow:inset 0 0 0 2px #6B7580"></span>İleride</span></div>'+gantt+'</section>'+
    '<div class="c3">'+
      '<section class="panel" aria-label="Ürün bazlı ilerleme"><div class="ph"><h2>Ürün bazlı ilerleme</h2><span class="sub">kalem</span></div><div style="display:flex;gap:12px;flex-wrap:wrap">'+L("var(--d-bar)","Bitti")+L("var(--s-bar)","Sanel'de")+L("var(--f-bar)","Alt tedarikçide")+L("var(--k-bar)","Stok")+L("var(--b-bar)","Belirsiz")+'</div><div style="display:flex;flex-direction:column;gap:3px">'+progress+'</div></section>'+

    '</div><p class="muted" style="margin:0;font-size:12.5px">Grafikler üstteki filtrelerle aynı veriyi kullanır. Bir çubuğa ya da işarete tıklayınca o kalemler Liste\'de açılır.</p></div>';
}

let deferred=false;

async function resolveNames(){
  if(S.standalone){document.querySelectorAll("[data-by]").forEach(e=>{const n=e.dataset.by;if(n&&n!=="anonim")e.title=(e.value?e.value+"\n":"")+"Son güncelleyen: "+n});return}
  if(!S.user)return;const els=[...document.querySelectorAll("[data-by]")].filter(e=>e.dataset.by);
  const ids=[...new Set(els.map(e=>e.dataset.by))].filter(i=>!(i in S.names));
  if(ids.length){try{const ps=await S.user.profiles(ids.slice(0,64));for(const i of ids)S.names[i]=(ps&&ps[i]&&ps[i].name)||""}catch(e){}}
  els.forEach(e=>{const n=S.names[e.dataset.by];if(n)e.title=(e.value?e.value+"\n":"")+"Son güncelleyen: "+n});
}

function bind(){
  const v=$("#view");

    const t=e.target;
    if(t.dataset.sel){t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel);t.closest(".row").classList.toggle("sel",t.checked);renderBulk();return}
    if(t.id==="selAll"){allItems().filter(x=>passes(x,S.f)).forEach(x=>{const k=x.rid+"/"+x.iid;t.checked?S.sel.add(k):S.sel.delete(k)});renderBody();return}
    if(t.dataset.iid&&t.dataset.f){
      const f=t.dataset.f;let val=t.value;
      if(f==="qty"||f==="delivered")val=val===""?null:Math.max(0,Number(val));

function closeModal(){NR=null;ED=null;$("#modal").innerHTML="";if(deferred)renderBody()}

    const t=e.target;
    if(NR){
      const map={nrPhase:"phase",nrNewPhase:"newPhase",nrPlat:"platform",nrDue:"due",nrSets:"sets",nrDirect:"direct",nrSpare:"spare"};
      if(map[t.id]){NR[map[t.id]]=t.value;if(!["nrPlat","nrDue"].includes(t.id))drawNew();return}
      if(t.dataset.nr){const r=NR.rows[t.dataset.nr][+t.dataset.ni],f=t.dataset.nf;if(f==="on")r.on=t.checked;else if(f==="qty"){r.qty=Number(t.value)||0;r.qtyEdited=true}else r[f]=t.value;drawNew();return}
    }
    if(ED){
      const map={edPhase:"phase",edPlat:"platform",edDue:"due",edSets:"sets",edDirect:"direct",edSpare:"spare",edNote:"note",apPart:"part",apQty:"qty",apType:"type",apMaker:"maker",apMat:"material",apOwner:"owner"};
      if(map[t.id])ED[map[t.id]]=t.value;
      if(t.id==="apPart"){const r=S.requests[ED.rid];const bp=(S.products[r.product]?.parts||[]).find(x=>x.part===t.value);if(bp){Object.assign(ED,{type:bp.type,maker:bp.maker,material:bp.material,owner:bp.owner});if(r.sets)ED.qty=r.sets*bp.perSet+(r.spare||0);drawEdit()}}
    }
  });
}

/* ---------- CSV ---------- */
async function exportCsv(){
  const list=allItems().filter(x=>passes(x,S.f,S.tab==="liste"?{}:{status:1})).sort((a,b)=>(a.due||"").localeCompare(b.due||"")||(a.p.ord||0)-(b.p.ord||0)||(a.it.ord||0)-(b.it.ord||0));
  const H=["Müşteri","Proje","Platform","Faz","Termin","Alt Parça","Üretim Tipi","Üretici","Ham Madde","Araç Set","Talep Miktarı","Teslim Edilen","Sorumlu","Durum","Not"];
  const q=v=>{v=v==null?"":String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[H.join(";")].concat(list.map(x=>[x.p.customer,x.p.name,x.r.platform,x.r.phase,x.due?fmtD(x.due):"",x.it.part,x.type,x.it.maker,x.it.material,x.r.sets||"",x.it.qty??"",x.it.delivered??"",x.it.owner,x.it.status,x.it.note].map(q).join(";")));
  if(!S.downloads){toast("Bu görünümde dosya indirme kullanılamıyor.",true);return}
  try{await S.downloads.save({filename:"prototip-listesi-"+todayISO()+".csv",data:"﻿"+lines.join("\r\n")});toast(list.length+" satır indirildi")}catch(e){if(e&&e.code!=="declined")toast("İndirme başarısız oldu.",true)}
}

/* ---------- Başlatma ---------- */
bindFilters();bind();bindModal();
document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
async function boot(){
  if(!window.claude||!window.claude.use){return bootStandalone()}
  const [db,user,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]);
  S.downloads=dl;S.user=user;
  if(user){try{S.me=await user.id()}catch(e){}try{const c=await user.can("data.write");if(c===false){S.canWrite=false;S.canWriteKnown=true;$("#ro").hidden=false}else if(c===true)S.canWriteKnown=true}catch(e){}}
  if(!db){noDb();return}
  S.db=db;setSync("Yükleniyor…");
  const onErr=e=>{setSync("Bağlantı kesildi",true);if(e&&e.code!=="revoked")toast("Canlı bağlantı kesildi; sayfayı yenileyin.",true)};
  db.collection("products").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.products=o;S.loaded.p=true;if(S.bomDraft&&!S.bomDraft._dirty)S.bomDraft=null;ready()},onErr);
  db.collection("requests").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.requests=o;S.loaded.r=true;ready()},onErr);
  db.doc("config/lists").onSnapshot(s=>{const d=s.exists?s.data():{};S.cfg={phases:d.phases||[],platforms:d.platforms||[],people:d.people||[],makers:d.makers||[],customers:d.customers||[],programs:d.programs||[]};ready()},onErr);
}
function ready(){if(S.loaded.p&&S.loaded.r){if(!pending)setSync("Canlı · "+Object.values(S.requests).filter(r=>!r.deleted).length+" talep");render()}}
/* ---------- Sunucu (kurum içi) modu: REST + canlı olaylar ---------- */
function restDb(onFail){
  const subs=[];let st=null;
  const snapFor=s=>{
    if(s.id){const d=s.col==="config"?(s.id==="lists"?st.config:undefined):(st[s.col]||{})[s.id];return{id:s.id,exists:!!d,data:()=>d,metadata:{}}}
    const o=st[s.col]||{};const docs=Object.keys(o).map(id=>({id,exists:true,data:()=>o[id],metadata:{}}));return{docs,size:docs.length,empty:!docs.length,metadata:{}}};
  const emit=col=>{if(!st)return;subs.filter(s=>!col||s.col===col).forEach(s=>{try{s.cb(snapFor(s))}catch(e){console.error(e)}})};
  const apply=ev=>{if(!st||!ev||!ev.col)return;if(ev.col==="config"){if(ev.id==="lists")st.config=ev.doc||{}}else{const o=st[ev.col]=st[ev.col]||{};if(ev.doc)o[ev.id]=ev.doc;else delete o[ev.id]}emit(ev.col)};
  const load=async()=>{const r=await fetch("api/state",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);st=await r.json();emit()};
  const req=async(method,col,id,body)=>{
    let r;try{r=await fetch("api/docs/"+encodeURIComponent(col)+"/"+encodeURIComponent(id),{method,headers:{"Content-Type":"application/json","X-PT-User":encodeURIComponent(S.me||"")},body:body?JSON.stringify(body):undefined})}
    catch(e){throw{code:"unavailable",message:"Sunucuya ulaşılamadı"}}
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok)throw{code:(j.error&&j.error.code)||"unavailable",message:(j.error&&j.error.message)||r.statusText};
    apply({col,id,doc:method==="DELETE"?null:j.doc});
  };
  const sub=(col,id,cb)=>{const s={col,id,cb};subs.push(s);if(st)setTimeout(()=>cb(snapFor(s)));return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}};
  const docRef=(col,id)=>({id,path:col+"/"+id,set:d=>req("PUT",col,id,d),update:d=>req("PATCH",col,id,d),delete:()=>req("DELETE",col,id),onSnapshot:cb=>sub(col,id,cb)});
  const db={doc:p=>{const a=p.split("/");return docRef(a[0],a[1])},collection:col=>({path:col,doc:id=>docRef(col,id||uid("d")),onSnapshot:cb=>sub(col,null,cb)})};
  load().then(()=>{
    let es;const open=()=>{try{es=new EventSource("api/events");es.onmessage=e=>{try{apply(JSON.parse(e.data))}catch(x){}};es.onopen=()=>{load().then(()=>setSync(pending?"Kaydediliyor…":"Canlı · "+Object.keys(st.requests||{}).length+" talep")).catch(()=>{})};es.onerror=()=>setSync("Bağlantı yeniden kuruluyor…",true)}catch(e){}};
    open();setInterval(()=>load().catch(()=>{}),60000);
  }).catch(onFail);
  return db;
}
function blobDownloads(){return{save:async({filename,data})=>{const blob=new Blob([data],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:"saved"}}}}
function renderWho(){
  const b=$("#who");b.hidden=false;
  if(S.serverUser){b.textContent=S.me;b.disabled=true;b.title="Kurum hesabınızla giriş yapıldı";return}
  b.textContent=S.me?S.me:"Adınızı girin";b.classList.toggle("need",!S.me);
}
function editWho(){
  if(S.serverUser)return;const b=$("#who");const inp=document.createElement("input");inp.className="who-in";inp.value=S.me||"";inp.placeholder="Ad Soyad";inp.setAttribute("aria-label","Adınız");
  b.hidden=true;b.after(inp);inp.focus();
  let fin=false;const done=save=>{if(fin)return;fin=true;if(save){S.me=inp.value.trim().slice(0,60);LS.set("me",S.me)}inp.remove();renderWho()};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")done(true);if(e.key==="Escape")done(false)});inp.addEventListener("blur",()=>done(true));
}
async function bootStandalone(){
  S.standalone=true;S.downloads=blobDownloads();S.me=LS.get("me","");
  try{const r=await fetch("api/me",{cache:"no-store"});if(r.ok){const j=await r.json();if(j.user){S.me=j.user;S.serverUser=true}if(j.readonly){S.canWrite=false;S.canWriteKnown=true;$("#ro").hidden=false;$("#ro").textContent="Bu sunucu yalnızca okuma modunda çalışıyor."}}}catch(e){}
  renderWho();$("#who").addEventListener("click",editWho);
  setSync("Yükleniyor…");
  const db=restDb(()=>{setSync("Sunucuya ulaşılamadı",true);$("#view").innerHTML='<div class="empty"><h3>Sunucuya ulaşılamadı</h3>Prototip Takip sunucusu çalışmıyor ya da ağ bağlantısı yok. Sayfayı birkaç saniye sonra yenileyin; sorun sürerse IT ile görüşün.</div>'});
  S.db=db;
  db.collection("products").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.products=o;S.loaded.p=true;if(S.bomDraft&&!S.bomDraft._dirty)S.bomDraft=null;ready()});
  db.collection("requests").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.requests=o;S.loaded.r=true;ready()});
  db.doc("config/lists").onSnapshot(s=>{const d=s.exists?s.data():{};S.cfg={phases:d.phases||[],platforms:d.platforms||[],people:d.people||[],makers:d.makers||[],customers:d.customers||[],programs:d.programs||[]};ready()});
}
function noDb(){setSync("Veritabanı yok",true);$("#view").innerHTML='<div class="empty"><h3>Paylaşılan veritabanına ulaşılamadı</h3>Bu sayfa verilerini claude.ai üzerindeki paylaşılan veritabanında tutar. Sayfayı claude.ai içinde açın; erişiminiz yoksa sayfa sahibinden paylaşım isteyin.</div>';$("#btnNew").hidden=true}
boot();
})();
