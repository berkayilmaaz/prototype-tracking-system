<rect x="692" y="56" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="720" y="65" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DÖNÜŞTÜR</text>
<!-- seed -> sqlite -->
