<rect x="860" y="300" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="882" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GÜNLÜK</text>
<!-- SSE: server -> browsers -->
<path d="M 580,300 V 352 Q 580,360 572,360 H 128 Q 120,360 120,352 V 304" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
