<rect x="208" y="208" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="228" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>
<!-- proxy -> server -->
<line x1="396" y1="228" x2="480" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="408" y="208" width="60" height="12" rx="2" fill="#f5f5f5"/>
<text x="438" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REST :8080</text>
<!-- server -> sqlite -->
<line x1="680" y1="228" x2="760" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="692" y="208" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="720" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OKU / YAZ</text>
