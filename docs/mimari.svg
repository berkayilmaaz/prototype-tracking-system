<rect x="860" y="128" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="894" y="137" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">İLK KURULUM</text>
