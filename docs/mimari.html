<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototip Takip Mimarisi</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--rule:rgba(45,49,66,0.12);
--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);padding:3rem 2rem}
.frame{max-width:1200px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:var(--serif);font-size:2rem;font-weight:400;letter-spacing:-.02em;margin-bottom:.5rem}
.sub{color:var(--muted);margin-bottom:1.5rem;max-width:760px;line-height:1.5}
.scroll{overflow-x:auto}
svg{width:100%;min-width:900px;display:block}
.cards{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:16px;margin:2rem 0 3rem}
.card{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:1.25rem}
.card h3{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink)}.dot.c{background:var(--accent)}.dot.m{background:var(--muted)}
.card ul{padding-left:1rem;font-size:13px;line-height:1.6;color:var(--muted)}
code{font-family:var(--mono);font-size:12px;color:var(--ink)}
h2{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:2rem 0 .75rem}
figure{margin-bottom:2rem}
figure img{width:100%;border:1px solid var(--rule);border-radius:6px;display:block}
figcaption{font-size:13px;color:var(--muted);margin-top:.5rem}
footer{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--rule);padding-top:1rem;margin-top:2rem}
@media (max-width:760px){.cards{grid-template-columns:1fr}body{padding:2rem 16px}}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Mimari · Sanel Ar-Ge</p>
<h1>Prototip Takip — sistem şeması</h1>
<div class="scroll">
